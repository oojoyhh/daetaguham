<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 매장 | 사장</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .store-card { display: grid; gap: 14px; }
    .store-card h2 { font-size: 19px; font-weight: 800; }
    .stat.alert b { color: var(--warn); }
    .stats.two { grid-template-columns:repeat(2,1fr); }
    .store-policy { color:var(--muted); font-size:12px; font-weight:700; }
    .store-alert { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; background:var(--accent-soft); border-radius:12px; color:inherit; }
    .store-alert small { display:block; color:var(--accent); font-size:11.5px; font-weight:800; margin-bottom:2px; }
    .store-alert b { display:block; font-size:13.5px; }
    .store-alert span { flex:none; color:var(--accent); font-size:12px; font-weight:800; }
    .store-state { text-align:center; padding:28px 18px; }
    .store-state p { margin:8px 0 16px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <h1>내 매장</h1>
      <span class="account-meta"><b id="ownerName">김효주 사장님</b><small id="ownerStoreCount">2개 매장 운영</small></span>
      <a class="icon-btn" href="../worker/notifications.html?role=owner" aria-label="알림">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="dot"></span>
      </a>
    </header>

    <main class="content">
      <p class="help num" id="storeDate" style="padding:0 4px">9월 15일 화요일 · 매장 2곳</p>

      <div id="storeList">
      <section class="card store-card">
        <div class="row between">
          <h2>성수점</h2><span class="store-policy">점장 승인 방식</span>
        </div>
        <div class="stats two">
          <div class="stat"><small>오늘 근무</small><b>3명</b></div>
          <div class="stat alert"><small>확인할 요청</small><b>3건</b></div>
        </div>
        <a class="store-alert" href="open-shift.html?store=A&amp;date=2026-09-18&amp;start=16%3A00&amp;end=22%3A00&amp;position=%EB%A7%88%EA%B0%90">
          <div><small>미배정 근무</small><b class="num">9/18(금) 16:00–22:00 · 마감</b></div><span>급구 올리기 ›</span>
        </a>
        <div class="btn-row">
          <a class="btn" href="../manager/today.html?role=owner&store=A">오늘 현황</a>
          <a class="btn" href="../manager/staff.html?role=owner&store=A">직원 관리</a>
        </div>
        <a class="btn btn-primary btn-block" href="../manager/schedule-bulk.html?role=owner&store=A">근무표 짜기</a>
        <a class="btn btn-text btn-block" href="../manager/approvals.html?role=owner&store=A">승인할 요청 3건 보기 ›</a>
      </section>

      <section class="card store-card">
        <div class="row between">
          <h2>건대점</h2><span class="store-policy">자동 확정 · 점장 없음</span>
        </div>
        <div class="stats two">
          <div class="stat"><small>오늘 근무</small><b>2명</b></div>
          <div class="stat"><small>모집 중</small><b>1건</b></div>
        </div>
        <a class="store-alert" href="open-shift-detail.html?id=g1">
          <div><small>급구 지원 현황</small><b class="num">9/29(화) 12:00–20:00 · 지원자 2명</b></div><span>고르기 ›</span>
        </a>
        <div class="btn-row">
          <a class="btn" href="../manager/today.html?role=owner&store=B">오늘 현황</a>
          <a class="btn" href="../manager/staff.html?role=owner&store=B">직원 관리</a>
        </div>
        <a class="btn btn-primary btn-block" href="../manager/schedule-bulk.html?role=owner&store=B">근무표 짜기</a>
      </section>
      </div>

      <span class="api-tag">GET /me · /stores/:id/summary</span>

      <a class="btn btn-block" href="store-new.html">+ 매장 만들기</a>
    </main>

    <nav class="tabbar" data-role="owner" data-active="stores" data-counts="approvals:3"></nav>
  </div>

  <script src="../js/common.js"></script>
  <script>
    const LIVE_MODE = DaetaguhamApi.isSignedIn();

    const formatDate = (date) => new Intl.DateTimeFormat("ko-KR", {
      month: "long", day: "numeric", weekday: "long",
    }).format(date);
    const formatShortDate = (dateTime) => {
      const date = new Date(dateTime);
      const weekday = ["일", "월", "화", "수", "목", "금", "토"][date.getDay()];
      return `${date.getMonth() + 1}/${date.getDate()}(${weekday})`;
    };
    const timePart = (dateTime) => dateTime.slice(11, 16);

    function liveStoreCard(store, summary) {
      const storeId = encodeURIComponent(store.storeId);
      const checkCount = (summary?.pendingApprovalCount || 0) + (summary?.pendingMemberCount || 0);
      const emptyShift = summary?.emptyShifts?.[0];
      const emptyLink = summary?.openShiftCount ? `
          <a class="store-alert" href="../worker/board.html?tab=mine">
            <div><small>급구 모집 중</small><b>${summary.openShiftCount}건의 근무가 지원자를 기다리고 있어요</b></div>
            <span>현황 보기 ›</span>
          </a>` : emptyShift ? (() => {
        const query = new URLSearchParams({
          store: String(store.storeId),
          date: emptyShift.startAt.slice(0, 10),
          start: timePart(emptyShift.startAt),
          end: timePart(emptyShift.endAt),
          position: emptyShift.position || "근무",
        });
        return `
          <a class="store-alert" href="open-shift.html?${query}">
            <div><small>미배정 근무</small><b class="num">${formatShortDate(emptyShift.startAt)} ${timePart(emptyShift.startAt)}–${timePart(emptyShift.endAt)} · ${escapeHTML(emptyShift.position || "근무")}</b></div>
            <span>급구 올리기 ›</span>
          </a>`;
      })() : "";

      return `
        <section class="card store-card">
          <div class="row between">
            <h2>${escapeHTML(store.storeName)}</h2><span class="store-policy">운영 현황</span>
          </div>
          <div class="stats two">
            <div class="stat"><small>오늘 근무</small><b>${summary?.todayWorkerCount ?? "-"}명</b></div>
            <div class="stat ${checkCount ? "alert" : ""}"><small>확인할 요청</small><b>${summary ? checkCount : "-"}건</b></div>
          </div>
          ${emptyLink}
          <div class="btn-row">
            <a class="btn" href="../manager/today.html?role=owner&store=${storeId}">오늘 현황</a>
            <a class="btn" href="../manager/staff.html?role=owner&store=${storeId}">직원 관리</a>
          </div>
          <a class="btn btn-primary btn-block" href="../manager/schedule-bulk.html?role=owner&store=${storeId}">근무표 짜기</a>
          ${summary?.pendingApprovalCount ? `<a class="btn btn-text btn-block" href="../manager/approvals.html?role=owner&store=${storeId}">승인할 요청 ${summary.pendingApprovalCount}건 보기 ›</a>` : ""}
          ${summary?.pendingMemberCount ? `<a class="btn btn-text btn-block" href="../manager/staff.html?role=owner&store=${storeId}">가입 신청 ${summary.pendingMemberCount}건 확인 ›</a>` : ""}
        </section>`;
    }

    async function loadLiveStores() {
      if (!LIVE_MODE) return;
      const session = DaetaguhamApi.getSession();
      const stores = (session.stores || []).filter((store) => store.myRole === "OWNER");
      const list = document.getElementById("storeList");
      document.getElementById("ownerName").textContent = `${session.user.name} 사장님`;
      document.getElementById("ownerStoreCount").textContent = `${stores.length}개 매장 운영`;
      document.getElementById("storeDate").textContent = `${formatDate(new Date())} · 매장 ${stores.length}곳`;

      if (!stores.length) {
        list.innerHTML = `<section class="card store-state"><b>아직 만든 매장이 없어요</b><p>매장을 만들면 근무표와 요청을 한곳에서 관리할 수 있어요.</p><a class="btn btn-primary" href="store-new.html">매장 만들기</a></section>`;
        return;
      }

      list.innerHTML = `<section class="card store-state"><p>매장 현황을 불러오는 중이에요…</p></section>`;
      const results = await Promise.allSettled(stores.map((store) =>
        DaetaguhamApi.request(`/stores/${store.storeId}/summary`)
      ));
      list.innerHTML = stores.map((store, index) =>
        liveStoreCard(store, results[index].status === "fulfilled" ? results[index].value : null)
      ).join("");
      const approvalTotal = results.reduce((sum, result) =>
        sum + (result.status === "fulfilled" ? result.value.pendingApprovalCount : 0), 0);
      const approvalBadge = document.querySelector('[data-count-for="approvals"]');
      if (approvalBadge) {
        approvalBadge.textContent = approvalTotal;
        approvalBadge.hidden = approvalTotal === 0;
      }
      if (results.some((result) => result.status === "rejected")) {
        toast("일부 매장 현황을 불러오지 못했어요.");
      }
    }

    loadLiveStores();
  </script>
</body>
</html>
