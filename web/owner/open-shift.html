<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>급구 등록 | 사장</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .step-no { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; font-weight: 800; margin-right: 8px; }
    .form { display: grid; gap: 14px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .cand { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line-2); cursor: pointer; }
    .cand:first-child { border-top: 0; }
    .cand input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
    .cand .grow { flex: 1; min-width: 0; }
    .cand .name { display: flex; align-items: center; gap: 6px; font-weight: 700; }
    .cand .reason { font-size: 13.5px; color: var(--ink-2); margin-top: 3px; }
    .excluded { padding: 12px 18px 16px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line-2); }

    .submit-bar { position: sticky; bottom: 68px; margin: 0 -16px -24px; padding: 20px 16px 16px; background: linear-gradient(rgba(244,245,248,0), var(--bg) 30%); }
    .done .big { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  </style>
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <h1>급구 등록</h1>
      <span class="account-meta"><b>배스킨라빈스</b><small id="ownerStoreMeta">성수점 · 김효주</small></span>
    </header>

    <main class="content" id="formView">
      <p class="help" style="padding:0 4px">미배정 근무를 올리면 일할 수 있는 사람에게 한 번에 알려요.</p>

      <!-- 1. 근무 정보 -->
      <h2 class="section-title"><span><span class="step-no">1</span>어떤 근무인가요?</span></h2>
      <section class="card form">
        <div class="field">
          <label for="store">매장</label>
          <select class="select" id="store">
            <option value="A">성수점</option>
            <option value="B">건대점</option>
          </select>
        </div>
        <div class="field">
          <label for="date">날짜</label>
          <input class="input" type="date" id="date" value="2026-09-25" min="2026-09-15">
        </div>
        <div class="two">
          <div class="field">
            <label for="start">시작</label>
            <input class="input" type="time" id="start" value="12:00" step="1800">
          </div>
          <div class="field">
            <label for="end">종료</label>
            <input class="input" type="time" id="end" value="18:00" step="1800">
          </div>
        </div>
        <p class="error-text" id="timeError" hidden>종료 시간은 시작 시간보다 늦어야 해요.</p>
        <div class="field">
          <label for="position">시간대 이름</label>
          <input class="input" id="position" maxlength="10" value="미들" placeholder="예: 오픈, 미들, 마감" required>
        </div>
        <div class="field">
          <label for="message">모집 안내 <small>선택</small></label>
          <textarea class="textarea" id="message" maxlength="100" rows="2" placeholder="직원에게 전달할 내용을 적어주세요."></textarea>
        </div>
      </section>

      <!-- 2. 대상 -->
      <h2 class="section-title"><span><span class="step-no">2</span>누구에게 알릴까요?</span></h2>
      <div class="segmented" role="group" aria-label="모집 범위">
        <button type="button" data-scope="STORE" aria-pressed="false" id="scopeStore">이 매장만</button>
        <button type="button" data-scope="OWNER_STORES" aria-pressed="true">내 매장 전체</button>
      </div>
      <section class="card tight">
        <div id="candList"></div>
        <p class="excluded" id="excluded"></p>
      </section>
      <p class="error-text" id="formError" hidden></p>
      <span class="api-tag">GET /stores/{id}/candidates?startAt&amp;endAt&amp;scope</span>

      <div class="submit-bar">
        <button class="btn btn-primary btn-block" type="button" id="submitBtn"></button>
        <span class="api-tag" style="margin-top:6px">POST /stores/{id}/open-shifts</span>
      </div>
    </main>

    <!-- 등록 완료 -->
    <main class="content" id="doneView" hidden>
      <section class="card done stack" style="gap:12px;margin-top:8px">
        <span class="pill open" style="width:fit-content">모집 중</span>
        <p class="big num" id="doneWhen"></p>
        <p class="muted" id="doneWho"></p>
      </section>
      <div class="notice gray">지원이 오면 알림으로 알려드려요. 지원자 중 한 명을 고르면 바로 근무표에 들어가요.</div>
      <a class="btn btn-primary btn-block" id="detailLink" href="stores.html">지원자 확인</a>
      <a class="btn btn-block" href="stores.html">내 매장 현황</a>
      <button class="btn btn-block" type="button" id="againBtn">급구 하나 더 올리기</button>
    </main>

    <nav class="tabbar" data-role="owner" data-active="open"></nav>
  </div>

  <script src="../js/common.js"></script>
  <script>
    const LIVE_MODE = DaetaguhamApi.isSignedIn();
    const SAMPLE_STORES = [
      { storeId: "A", storeName: "성수점" },
      { storeId: "B", storeName: "건대점" },
    ];
    const SAMPLE_CANDIDATES = [
      { userId: "suyeon", name: "인수연", storeName: "건대점", aiReason: "이번 주 근무가 가장 적고, 금요일 종일 가능해요" },
      { userId: "kimmin", name: "김민", storeName: "성수점", aiReason: "건대점에서도 두 번 일해봤고, 금요일 종일 가능해요" },
      { userId: "jinho", name: "이진호", storeName: "성수점", aiReason: "금요일 오후 가능하고, 최근 급구를 안 했어요" },
      { userId: "minhyeok", name: "배민혁", storeName: "건대점", aiReason: "시간은 맞지만 이번 주 근무가 조금 많아요" },
      { userId: "yujin", name: "박유진", storeName: "성수점", aiReason: "가능하지만 최근 급구를 3번 해줬어요" },
    ];

    const session = DaetaguhamApi.getSession();
    let stores = LIVE_MODE
      ? (session.stores || []).filter((store) => store.myRole === "OWNER" && (!store.memberStatus || store.memberStatus === "ACTIVE"))
      : SAMPLE_STORES;
    let candidates = LIVE_MODE ? [] : SAMPLE_CANDIDATES;
    let excludedCount = LIVE_MODE ? 0 : 3;
    let scope = "OWNER_STORES";
    let checked = new Set();
    let candidateLoadVersion = 0;
    let positionTouched = false;

    const storeValue = () => document.getElementById("store").value;
    const storeInfo = () => stores.find((store) => String(store.storeId) === storeValue());
    const candidateId = (candidate) => String(candidate.userId);
    const field = (id) => document.getElementById(id);
    const localISO = (date) => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    const startAt = () => `${field("date").value}T${field("start").value}:00`;
    const endAt = () => `${field("date").value}T${field("end").value}:00`;

    function showError(message = "") {
      field("formError").hidden = !message;
      field("formError").textContent = message;
    }

    function validTime() {
      const ok = field("end").value > field("start").value;
      field("timeError").hidden = ok;
      return ok;
    }

    function validForm() {
      if (!field("date").value || !field("start").value || !field("end").value || !validTime()) return false;
      if (!field("position").value.trim()) { showError("시간대 이름을 입력해 주세요."); return false; }
      if (LIVE_MODE && new Date(startAt()).getTime() <= Date.now()) {
        showError("아직 시작하지 않은 근무만 급구로 올릴 수 있어요.");
        return false;
      }
      showError();
      return true;
    }

    function render() {
      const store = storeInfo();
      const storeName = store?.storeName || "매장";
      document.querySelectorAll(".account-meta small").forEach((element) => (element.textContent = storeName));
      field("scopeStore").textContent = `${storeName}만`;
      document.querySelectorAll("[data-scope]").forEach((button) =>
        button.setAttribute("aria-pressed", String(button.dataset.scope === scope)));
      [...checked].forEach((id) => {
        if (!candidates.some((candidate) => candidateId(candidate) === id)) checked.delete(id);
      });

      field("candList").innerHTML = candidates.length ? candidates.map((candidate) => {
        const id = candidateId(candidate);
        const sameStore = candidate.storeName === storeName;
        return `<label class="cand">
          <input type="checkbox" value="${escapeHTML(id)}" ${checked.has(id) ? "checked" : ""}>
          <div class="grow">
            <p class="name">${escapeHTML(candidate.name)}<span class="pill ${sameStore ? "store-a" : "store-b"}">${escapeHTML(candidate.storeName)}</span></p>
            <p class="reason">${escapeHTML(candidate.aiReason || `이번 주 ${candidate.weekHours || 0}시간 근무`)}</p>
          </div>
        </label>`;
      }).join("") : `<p class="empty">이 시간에 지원할 수 있는 직원이 없어요</p>`;
      field("excluded").textContent = `근무 가능 시간이 맞지 않거나 일정이 겹치는 ${excludedCount}명은 제외했어요.`;
      field("submitBtn").textContent = checked.size ? `${checked.size}명에게 알림 보내기` : "알릴 사람을 골라주세요";
      field("submitBtn").disabled = checked.size === 0;
    }

    async function loadTemplates() {
      if (!LIVE_MODE || !storeValue()) return;
      try {
        const templates = await DaetaguhamApi.request(`/stores/${storeValue()}/shift-templates`);
        const matched = templates.find((template) =>
          template.startTime.slice(0, 5) === field("start").value && template.endTime.slice(0, 5) === field("end").value);
        if (matched && !positionTouched) {
          field("position").value = matched.name;
        }
      } catch (apiError) {
        showError(apiError.message);
      }
    }

    async function loadCandidates() {
      if (!LIVE_MODE) {
        candidates = scope === "STORE"
          ? SAMPLE_CANDIDATES.filter((candidate) => candidate.storeName === storeInfo().storeName)
          : SAMPLE_CANDIDATES;
        excludedCount = scope === "STORE" ? 2 : 3;
        checked = new Set(candidates.slice(0, 3).map(candidateId));
        render();
        return;
      }
      if (!validForm() || !storeValue()) { candidates = []; checked.clear(); render(); return; }
      const version = ++candidateLoadVersion;
      field("candList").innerHTML = `<p class="empty">가능한 직원을 찾는 중이에요…</p>`;
      field("submitBtn").disabled = true;
      const query = new URLSearchParams({ startAt: startAt(), endAt: endAt(), scope });
      try {
        const result = await DaetaguhamApi.request(`/stores/${storeValue()}/candidates?${query}`);
        if (version !== candidateLoadVersion) return;
        candidates = result.candidates || [];
        excludedCount = result.excludedCount || 0;
        checked = new Set(candidates.slice(0, 3).map(candidateId));
        showError();
        render();
      } catch (apiError) {
        if (version !== candidateLoadVersion) return;
        candidates = [];
        checked.clear();
        showError(apiError.message);
        render();
      }
    }

    field("candList").addEventListener("change", (event) => {
      if (event.target.type !== "checkbox") return;
      event.target.checked ? checked.add(event.target.value) : checked.delete(event.target.value);
      render();
    });
    document.querySelectorAll("[data-scope]").forEach((button) =>
      button.addEventListener("click", () => { scope = button.dataset.scope; loadCandidates(); })
    );
    field("store").addEventListener("change", async () => { await loadTemplates(); await loadCandidates(); });
    ["date", "start", "end"].forEach((id) => field(id).addEventListener("change", async () => {
      if (id === "start" || id === "end") await loadTemplates();
      await loadCandidates();
    }));
    field("position").addEventListener("input", () => (positionTouched = true));

    field("submitBtn").addEventListener("click", async () => {
      if (!validForm() || !checked.size) return;
      const store = storeInfo();
      const selected = candidates.filter((candidate) => checked.has(candidateId(candidate)));
      const button = field("submitBtn");
      button.disabled = true;
      let notified = selected.length;
      let requestId = null;
      if (LIVE_MODE) {
        try {
          const result = await DaetaguhamApi.request(`/stores/${storeValue()}/open-shifts`, {
            method: "POST",
            body: {
              startAt: startAt(),
              endAt: endAt(),
              position: field("position").value.trim(),
              scope,
              message: field("message").value.trim() || null,
              notifyUserIds: [...checked].map(Number),
            },
          });
          notified = result.notifiedCount;
          requestId = result.request.id;
        } catch (apiError) {
          showError(apiError.message);
          button.disabled = false;
          return;
        }
      }
      field("doneWhen").textContent = `${store.storeName} ${fmtDate(field("date").value)} ${field("start").value}–${field("end").value}`;
      field("doneWho").textContent = `${selected.map((candidate) => candidate.name).join(", ")}님 등 ${notified}명에게 알림을 보냈어요.`;
      field("detailLink").href = requestId ? `open-shift-detail.html?id=${requestId}` : "open-shift-detail.html?id=g1";
      field("formView").hidden = true;
      field("doneView").hidden = false;
      window.scrollTo(0, 0);
      toast(`${notified}명에게 알림을 보냈어요`);
    });

    field("againBtn").addEventListener("click", async () => {
      field("doneView").hidden = true;
      field("formView").hidden = false;
      await loadCandidates();
    });

    async function initialize() {
      if (!stores.length) {
        field("store").innerHTML = `<option value="">운영 중인 매장이 없어요</option>`;
        showError("급구를 등록할 사장 매장이 없어요.");
        field("submitBtn").disabled = true;
        return;
      }
      field("store").innerHTML = stores.map((store) =>
        `<option value="${store.storeId}">${escapeHTML(store.storeName)}</option>`).join("");
      const requestedStore = params.get("store");
      if (stores.some((store) => String(store.storeId) === requestedStore)) field("store").value = requestedStore;
      if (params.get("date")) field("date").value = params.get("date");
      if (params.get("start")) field("start").value = params.get("start");
      if (params.get("end")) field("end").value = params.get("end");
      if (params.get("position")) {
        field("position").value = params.get("position");
        positionTouched = true;
      }
      if (LIVE_MODE) {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const minimum = localISO(new Date());
        field("date").min = minimum;
        if (!field("date").value || new Date(startAt()).getTime() <= Date.now()) field("date").value = localISO(tomorrow);
        await loadTemplates();
        await loadCandidates();
      } else {
        candidates = scope === "STORE"
          ? SAMPLE_CANDIDATES.filter((candidate) => candidate.storeName === storeInfo().storeName)
          : SAMPLE_CANDIDATES;
        checked = new Set(candidates.slice(0, 3).map(candidateId));
        render();
      }
    }

    initialize();
  </script>
</body>
</html>
