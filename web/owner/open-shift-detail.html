<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>급구 지원자 | 사장</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .summary .date { font-size: 24px; font-weight: 850; letter-spacing: -.02em; }
    .summary .time { font-size: 16px; color: var(--ink-2); margin-top: 2px; }
    .info { display: grid; grid-template-columns: 72px 1fr; gap: 8px 12px; font-size: 14px; margin: 16px 0 0; padding-top: 16px; border-top: 1px solid var(--line-2); }
    .info dt { color: var(--muted); }
    .info dd { margin: 0; }

    .applicant { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 16px 18px; border-top: 1px solid var(--line-2); }
    .applicant:first-child { border-top: 0; }
    .applicant .avatar { width: 44px; height: 44px; }
    .applicant .name { display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 850; }
    .applicant .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .applicant .reason { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
    .ai-mark { font-size: 10px; font-weight: 800; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 4px; margin-right: 4px; vertical-align: 1px; }
    .applicant.dim { opacity: .45; }
  </style>
</head>
<body>
  <div class="phone">
    <header class="topbar sub">
      <a class="icon-btn" href="stores.html" aria-label="뒤로"><span id="backIcon"></span></a>
      <h1>급구 지원자</h1>
      <span class="account-meta"><b>김효주 사장님</b><small>건대점</small></span>
    </header>

    <main class="content">
      <p class="error-text" id="loadError" hidden></p>
      <section class="card summary">
        <div class="row between">
          <p class="date num" id="date"></p>
          <span class="pill open" id="statusPill">모집 중</span>
        </div>
        <p class="time num" id="time"></p>
        <dl class="info" id="info"></dl>
        <span class="api-tag" style="margin-top:12px">GET /requests/{id}</span>
      </section>

      <div class="notice" id="notice" hidden></div>

      <h2 class="section-title" id="listTitle"></h2>
      <section class="card tight" id="applicants"></section>
      <p class="help" style="padding:0 4px">급구는 사장님이 고르면 승인 없이 바로 근무표에 들어가요.</p>
      <span class="api-tag">PUT /requests/{id}/selection</span>

      <button class="btn btn-text btn-block" type="button" id="cancelBtn">급구 취소</button>
    </main>

    <nav class="tabbar" data-role="owner" data-active="open"></nav>
  </div>

  <dialog class="sheet" id="selectSheet">
    <form method="dialog">
      <div class="sheet-body">
        <h3 id="selectTitle"></h3>
        <p id="selectDesc"></p>
      </div>
      <div class="sheet-actions">
        <button class="btn" value="no">취소</button>
        <button class="btn btn-primary" value="yes">확정하기</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="cancelSheet">
    <form method="dialog">
      <div class="sheet-body">
        <h3>급구를 취소할까요?</h3>
        <p>지원자와 알림 받은 사람들에게 취소됐다고 알려드려요. 근무는 미배정 상태로 남아요.</p>
        <span class="api-tag">PUT /requests/{id}/cancel</span>
      </div>
      <div class="sheet-actions">
        <button class="btn" value="no">돌아가기</button>
        <button class="btn btn-danger" value="yes">급구 취소</button>
      </div>
    </form>
  </dialog>

  <script src="../js/common.js"></script>
  <script>
    document.getElementById("backIcon").outerHTML = BACK_ICON;
    const LIVE_MODE = DaetaguhamApi.isSignedIn() && /^\d+$/.test(params.get("id") || "");
    const requestId = params.get("id");
    const SAMPLE = {
      id: "g1", storeName: "건대점", date: "2026-09-29", start: "12:00", end: "20:00", position: "미들",
      scope: "OWNER_STORES", status: "OPEN", message: "화요일 점심 손님이 많아요. 도와주세요!",
      applicants: [
        { id: "seokhwi", name: "한석휘", storeName: "건대점", weekHours: 14, helperCount: 1, appliedAt: "11:40", aiReason: "건대점 소속이고 이번 주 근무가 적어요", status: "APPLIED" },
        { id: "jaewoong", name: "정재웅", storeName: "성수점", weekHours: 24, helperCount: 0, appliedAt: "12:15", aiReason: "성수점에서 오는 헬퍼예요. 이번 주 근무가 많은 편이에요", status: "APPLIED" },
      ],
    };
    const STATUS_LABEL = { WITHDRAWN: "철회", NOT_SELECTED: "미선택", REJECTED: "반려", DECLINED: "거절" };
    let shift = SAMPLE;
    let pending = null;
    let aiReasons = new Map();
    let busy = false;

    const selectSheet = document.getElementById("selectSheet");
    const cancelSheet = document.getElementById("cancelSheet");
    const showError = (message = "") => {
      const error = document.getElementById("loadError");
      error.hidden = !message;
      error.textContent = message;
    };
    const scopeLabel = (scope) => scope === "STORE" ? "이 매장만" : "내 매장 전체";
    const timeOnly = (value) => value ? value.slice(11, 16) : "";

    function normalize(response) {
      const start = response.shift.startAt;
      const end = response.shift.endAt;
      return {
        id: String(response.id),
        storeId: response.shift.storeId,
        storeName: response.storeName,
        date: start.slice(0, 10),
        start: timeOnly(start),
        end: timeOnly(end),
        position: response.shift.position,
        scope: response.scope,
        status: response.status,
        message: response.reason,
        workerName: response.shift.workerName,
        applicants: (response.applications || []).map((application) => ({
          id: String(application.id),
          applicantId: application.applicantId,
          name: application.applicantName,
          storeName: application.applicantStoreName,
          weekHours: application.weekHours,
          helperCount: application.helperCount,
          appliedAt: timeOnly(application.createdAt),
          aiReason: application.aiReason || aiReasons.get(String(application.applicantId)),
          message: application.message,
          status: application.status,
        })),
      };
    }

    function renderSummary() {
      document.querySelectorAll(".account-meta small").forEach((element) => (element.textContent = shift.storeName));
      document.getElementById("date").textContent = fmtDate(shift.date);
      document.getElementById("time").textContent = `${shift.start}–${shift.end} · ${shift.storeName} ${shift.position}`;
      const rows = [["범위", scopeLabel(shift.scope)]];
      if (shift.message) rows.push(["안내", shift.message]);
      document.getElementById("info").innerHTML = rows
        .map(([key, value]) => `<dt>${key}</dt><dd>${escapeHTML(value)}</dd>`).join("");
    }

    function render() {
      renderSummary();
      const chosen = shift.applicants.find((applicant) => applicant.status === "SELECTED")
        || (shift.workerName ? { name: shift.workerName } : null);
      const pill = document.getElementById("statusPill");
      const notice = document.getElementById("notice");
      if (shift.status === "OPEN") {
        pill.className = "pill open"; pill.textContent = "모집 중";
        notice.hidden = true;
      } else if (shift.status === "CONFIRMED") {
        pill.className = "pill ok"; pill.textContent = "확정";
        notice.hidden = false; notice.className = "notice ok";
        notice.textContent = `${chosen?.name || "선택한 직원"}님으로 확정했어요. 근무표에 바로 반영됐어요.`;
      } else {
        pill.className = "pill";
        pill.textContent = shift.status === "EXPIRED" ? "마감" : "취소됨";
        notice.hidden = false; notice.className = "notice gray";
        notice.textContent = shift.status === "EXPIRED"
          ? "지원자를 확정하지 못하고 마감됐어요."
          : "급구를 취소했어요. 근무는 미배정 상태로 남아요.";
      }
      document.getElementById("cancelBtn").hidden = shift.status !== "OPEN";
      const activeCount = shift.applicants.filter((applicant) => ["APPLIED", "SELECTED"].includes(applicant.status)).length;
      document.getElementById("listTitle").innerHTML = `지원한 사람 <small>${activeCount}명</small>`;
      document.getElementById("applicants").innerHTML = shift.applicants.length ? shift.applicants.map((applicant) => {
        const isChosen = applicant.status === "SELECTED";
        const dim = shift.status !== "OPEN" && !isChosen;
        let action = "";
        if (shift.status === "OPEN" && applicant.status === "APPLIED") {
          action = `<button class="btn btn-sm btn-primary" type="button" data-id="${escapeHTML(applicant.id)}">선택</button>`;
        } else if (isChosen) action = `<span class="pill ok">확정</span>`;
        else if (STATUS_LABEL[applicant.status]) action = `<span class="pill">${STATUS_LABEL[applicant.status]}</span>`;
        const reason = applicant.aiReason || applicant.message || `이번 주 ${applicant.weekHours || 0}시간 근무 예정이에요.`;
        return `<div class="applicant ${dim ? "dim" : ""}">
          <span class="avatar">${escapeHTML(shortName(applicant.name))}</span>
          <div>
            <p class="name">${escapeHTML(applicant.name)}<span class="pill ${applicant.storeName === shift.storeName ? "store-a" : "store-b"}">${escapeHTML(applicant.storeName)}</span></p>
            <p class="meta num">${applicant.appliedAt || "–"} 지원 · 이번 주 ${applicant.weekHours || 0}시간${applicant.helperCount ? ` · 도움 ${applicant.helperCount}회` : ""}</p>
            <p class="reason">${applicant.aiReason ? `<span class="ai-mark">AI</span>` : ""}${escapeHTML(reason)}</p>
          </div>${action}
        </div>`;
      }).join("") : `<p class="empty">아직 지원한 사람이 없어요</p>`;
    }

    async function loadDetail() {
      if (!LIVE_MODE) { render(); return; }
      showError();
      try {
        const response = await DaetaguhamApi.request(`/requests/${requestId}`);
        shift = normalize(response);
        if (shift.status === "OPEN") {
          const query = new URLSearchParams({
            startAt: response.shift.startAt,
            endAt: response.shift.endAt,
            scope: response.scope,
          });
          try {
            const recommendations = await DaetaguhamApi.request(`/stores/${response.shift.storeId}/candidates?${query}`);
            aiReasons = new Map((recommendations.candidates || []).map((candidate) => [String(candidate.userId), candidate.aiReason]));
            shift = normalize(response);
          } catch (ignored) { /* 지원자 정보는 계속 표시 */ }
        }
        render();
      } catch (apiError) {
        showError(apiError.message);
      }
    }

    document.getElementById("applicants").addEventListener("click", (event) => {
      const button = event.target.closest("[data-id]");
      if (!button || busy) return;
      pending = shift.applicants.find((applicant) => applicant.id === button.dataset.id);
      document.getElementById("selectTitle").textContent = `${pending.name}님으로 확정할까요?`;
      document.getElementById("selectDesc").textContent =
        `${fmtDate(shift.date)} ${shift.start}–${shift.end} ${shift.storeName} 근무에 바로 배정돼요. 나머지 지원자에게는 결과를 알려드려요.`;
      selectSheet.showModal();
    });

    selectSheet.addEventListener("close", async () => {
      if (selectSheet.returnValue !== "yes" || !pending || busy) return;
      busy = true;
      if (LIVE_MODE) {
        try {
          const response = await DaetaguhamApi.request(`/requests/${requestId}/selection`, {
            method: "PUT",
            body: { applicationId: Number(pending.id), offerShiftId: null },
          });
          shift = normalize(response);
        } catch (apiError) {
          showError(apiError.message);
          busy = false;
          return;
        }
      } else {
        shift.applicants.forEach((applicant) => (applicant.status = applicant.id === pending.id ? "SELECTED" : "NOT_SELECTED"));
        shift.status = "CONFIRMED";
        shift.workerName = pending.name;
      }
      busy = false;
      render();
      toast(`${pending.name}님으로 확정했어요`);
    });

    document.getElementById("cancelBtn").addEventListener("click", () => {
      if (!busy) cancelSheet.showModal();
    });
    cancelSheet.addEventListener("close", async () => {
      if (cancelSheet.returnValue !== "yes" || busy) return;
      busy = true;
      if (LIVE_MODE) {
        try {
          const response = await DaetaguhamApi.request(`/requests/${requestId}/cancel`, { method: "PUT" });
          shift = normalize(response);
        } catch (apiError) {
          showError(apiError.message);
          busy = false;
          return;
        }
      } else shift.status = "CANCELED";
      busy = false;
      render();
      toast("급구를 취소했어요");
    });

    loadDetail();
  </script>
</body>
</html>
