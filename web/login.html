<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 대타구함</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .brand { padding: 72px 24px 28px; }
    .brand .mark { width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 800; }
    .brand h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin-top: 20px; }
    .brand p { color: var(--ink-2); margin-top: 6px; }
    .demo { font-size: 12.5px; color: var(--muted); background: var(--surface); border-radius: 14px; padding: 12px 14px; line-height: 1.65; }
    .demo b { color: var(--ink-2); }
    .demo a { color: var(--accent); font-weight: 750; }
  </style>
</head>
<body>
  <div class="phone no-tab">
    <div class="brand">
      <div class="mark" aria-hidden="true">대</div>
      <h1>대타구함</h1>
      <p>전화 돌리지 않고, 근무 바꾸기</p>
    </div>

    <main class="content">
      <form class="stack" id="loginForm" novalidate style="gap:12px">
        <div class="field">
          <label for="phone">휴대폰 번호</label>
          <input class="input" id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000">
        </div>
        <div class="field">
          <label for="pw">비밀번호</label>
          <input class="input" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
        </div>
        <p class="error-text" id="loginError" hidden></p>
        <p class="help" id="coldStartHint" hidden>무료 배포 서버를 깨우는 중이에요. 첫 로그인은 1분 이상 걸릴 수 있어요.</p>
        <p class="help" id="serverStatus" role="status">배포 서버 상태를 확인하는 중이에요…</p>
        <button class="btn btn-primary btn-block" type="submit">로그인</button>
        <span class="api-tag">POST /auth/login</span>
      </form>

      <button class="btn btn-text btn-block" type="button" id="signupBtn">처음이에요 · 회원가입</button>

      <div class="demo">
        <b>이제 실제 백엔드와 연결돼요.</b><br>
        가입한 계정으로 로그인하거나 새 계정을 만들어 주세요.
        무료 배포 서버가 잠들어 있으면 첫 로그인은 1분 이상 걸릴 수 있어요.
        준비된 화면만 둘러보려면 <a href="index.html">역할별 샘플 화면</a>으로 돌아갈 수 있어요.
      </div>
    </main>
  </div>

  <dialog class="sheet" id="signupSheet">
    <form method="dialog" id="signupForm" novalidate>
      <div class="sheet-body">
        <h3>회원가입</h3>
        <div class="field">
          <label for="suName">이름</label>
          <input class="input" id="suName" autocomplete="name" placeholder="실명">
        </div>
        <div class="field">
          <label for="suPhone">휴대폰 번호</label>
          <input class="input" id="suPhone" type="tel" inputmode="numeric" placeholder="010-0000-0000">
        </div>
        <div class="field">
          <label for="suPw">비밀번호</label>
          <input class="input" id="suPw" type="password" autocomplete="new-password" placeholder="8자 이상">
        </div>
        <p class="error-text" id="signupError" hidden></p>
        <span class="api-tag">POST /auth/signup</span>
      </div>
      <div class="sheet-actions">
        <button class="btn" type="button" id="signupClose">닫기</button>
        <button class="btn btn-primary" type="submit">가입하기</button>
      </div>
    </form>
  </dialog>

  <script src="js/common.js"></script>
  <script>
    ["phone", "suPhone"].forEach((id) => {
      const el = document.getElementById(id);
      el.addEventListener("input", () => (el.value = formatPhone(el.value)));
    });

    const showError = (element, message) => {
      element.textContent = message;
      element.hidden = false;
    };

    const serverStatus = document.getElementById("serverStatus");
    if (DaetaguhamApi.baseUrl.includes("onrender.com")) {
      DaetaguhamApi.warmUp()
        .then(() => {
          serverStatus.textContent = "배포 서버 준비 완료";
          serverStatus.style.color = "var(--accent)";
        })
        .catch(() => {
          serverStatus.textContent = "로그인하면 서버 연결을 다시 시도할게요.";
        });
    } else {
      serverStatus.hidden = true;
    }

    const setBusy = (button, busy, busyLabel) => {
      if (!button.dataset.label) button.dataset.label = button.textContent;
      button.disabled = busy;
      button.setAttribute("aria-busy", String(busy));
      button.textContent = busy ? busyLabel : button.dataset.label;
    };

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const phone = document.getElementById("phone").value;
      const digits = phone.replace(/\D/g, "");
      const pw = document.getElementById("pw").value;
      const err = document.getElementById("loginError");
      const coldStartHint = document.getElementById("coldStartHint");
      const button = e.currentTarget.querySelector('[type="submit"]');
      err.hidden = true;
      coldStartHint.hidden = true;

      if (digits.length !== 11 || !pw) {
        showError(err, "휴대폰 번호 11자리와 비밀번호를 입력해 주세요.");
        return;
      }
      setBusy(button, true, "로그인 중…");
      const coldStartTimer = setTimeout(() => {
        coldStartHint.hidden = false;
        button.textContent = "서버를 깨우는 중…";
      }, 6000);
      try {
        const session = await DaetaguhamApi.login(formatPhone(digits), pw);
        location.href = DaetaguhamApi.homePath(session);
      } catch (error) {
        showError(err, error.message || "로그인하지 못했어요.");
      } finally {
        clearTimeout(coldStartTimer);
        coldStartHint.hidden = true;
        setBusy(button, false, "");
      }
    });

    const sheet = document.getElementById("signupSheet");
    document.getElementById("signupBtn").addEventListener("click", () => sheet.showModal());
    document.getElementById("signupClose").addEventListener("click", () => sheet.close());

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("suName").value.trim();
      const digits = document.getElementById("suPhone").value.replace(/\D/g, "");
      const pw = document.getElementById("suPw").value;
      const err = document.getElementById("signupError");
      const button = e.currentTarget.querySelector('[type="submit"]');
      err.hidden = true;

      let msg = "";
      if (!name) msg = "이름을 입력해 주세요.";
      else if (digits.length !== 11) msg = "휴대폰 번호 11자리를 입력해 주세요.";
      else if (pw.length < 8) msg = "비밀번호는 8자 이상이어야 해요.";

      if (msg) { showError(err, msg); return; }
      setBusy(button, true, "가입 중…");
      try {
        await DaetaguhamApi.signup(name, formatPhone(digits), pw);
        location.href = `start.html?name=${encodeURIComponent(name)}`;
      } catch (error) {
        showError(err, error.message || "회원가입을 완료하지 못했어요.");
      } finally {
        setBusy(button, false, "");
      }
    });
  </script>
</body>
</html>
