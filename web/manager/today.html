<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODAY | 점장</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .date-line { font-size: 14px; color: var(--muted); padding: 0 4px; }
    .now-line { font-size: 13px; color: var(--muted); margin-top: 10px; }
    .message-board { padding:15px; }
    .message-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .message-head h2 { margin:0; font-size:17px; }
    .message-head small { display:block; margin-top:2px; color:var(--muted); font-size:11.5px; }
    .message-line { display:grid; grid-template-columns:48px minmax(0,1fr) 28px; gap:10px; align-items:start; padding:12px 0; border-top:1px solid var(--line-2); }
    .message-line:first-child { margin-top:9px; }
    .message-line time { color:var(--accent); font-size:12.5px; font-weight:850; font-variant-numeric:tabular-nums; }
    .message-line p { margin:0; color:var(--ink-2); font-size:13.5px; line-height:1.45; }
    .message-line button { width:28px; height:28px; border:0; border-radius:8px; background:transparent; color:var(--muted); cursor:pointer; }
    .message-empty { margin:12px 0 0; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <h1>TODAY</h1>
      <span class="account-meta"><b>배스킨라빈스</b><small>성수점</small></span>
      <a class="icon-btn" id="notificationLink" href="../worker/notifications.html?role=manager" aria-label="알림">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="dot"></span>
      </a>
    </header>

    <main class="content">
      <div class="segmented" id="storeSwitch" hidden></div>
      <p class="date-line num" id="todayDate"></p>
      <p class="error-text" id="overviewError" hidden></p>

      <a class="banner" id="approvalBanner" href="approvals.html"><span class="grow"></span><span aria-hidden="true">›</span></a>
      <a class="banner blue" id="applyBanner" href="staff.html"><span class="grow"></span><span aria-hidden="true">›</span></a>

      <section class="card message-board" aria-labelledby="messageTitle">
        <div class="message-head">
          <div><h2 id="messageTitle">매장 전달사항</h2><small>직원 알림으로 바로 공유돼요</small></div>
          <button class="btn btn-sm" type="button" id="messageBtn">+ 작성</button>
        </div>
        <div id="messageList"></div>
        <span class="api-tag" style="margin-top:8px">GET /stores/{id}/notices · DELETE /notices/{id}</span>
      </section>

      <h2 class="section-title">오늘 근무 <small id="todayCount"></small></h2>
      <section class="card">
        <div class="tl" id="todayTl"></div>
        <p class="now-line" id="nowLine"></p>
        <span class="api-tag" style="margin-top:8px">GET /stores/{id}/shifts?date</span>
      </section>

      <h2 class="section-title">이번 주 미배정 근무 <small id="openCount"></small></h2>
      <section class="card tight" id="openList"></section>
    </main>

    <nav class="tabbar" data-role="manager" data-active="today" data-role-param data-counts="approvals:3"></nav>
  </div>

  <dialog class="sheet" id="messageSheet">
    <form id="messageForm" novalidate>
      <div class="sheet-body">
        <h3>전달사항 작성</h3>
        <p class="muted">근무표와 분리된 매장 공지로 직원 알림에 전달돼요.</p>
        <div class="field">
          <label for="messageDate">관련 날짜</label>
          <input class="input" type="date" id="messageDate">
        </div>
        <div class="field">
          <label for="messageText">내용</label>
          <textarea class="textarea" id="messageText" maxlength="160" placeholder="예: 오후 2시 재료 입고 예정이에요. 냉동고 앞을 비워주세요."></textarea>
        </div>
        <p class="error-text" id="messageError" hidden></p>
        <span class="api-tag">POST /stores/{id}/notices</span>
      </div>
      <div class="sheet-actions">
        <button class="btn" type="button" id="messageClose">닫기</button>
        <button class="btn btn-primary" type="submit" id="messageSubmit">직원에게 공유</button>
      </div>
    </form>
  </dialog>

  <script src="../js/common.js"></script>
  <script>
    const LIVE_MODE = DaetaguhamApi.isSignedIn();
    const isOwner = params.get("role") === "owner";
    const SAMPLE_STORES = isOwner
      ? [{ storeId: "A", storeName: "성수점" }, { storeId: "B", storeName: "건대점" }]
      : [{ storeId: "A", storeName: "성수점" }];
    const SAMPLE_OVERVIEWS = {
      A: {
        todayWorkerCount: 3, pendingApprovalCount: 3, pendingMemberCount: 1, openShiftCount: 0,
        todayShifts: [
          { workerName: "김민", startAt: "2026-09-15T10:00:00", endAt: "2026-09-15T16:00:00", position: "오픈" },
          { workerName: "박유진", startAt: "2026-09-15T12:00:00", endAt: "2026-09-15T18:00:00", position: "미들" },
          { workerName: "이진호", startAt: "2026-09-15T16:00:00", endAt: "2026-09-15T22:00:00", position: "마감" },
        ],
        emptyShifts: [{ id: 91, startAt: "2026-09-18T16:00:00", endAt: "2026-09-18T22:00:00", position: "마감" }],
      },
      B: {
        todayWorkerCount: 2, pendingApprovalCount: 0, pendingMemberCount: 0, openShiftCount: 0,
        todayShifts: [
          { workerName: "한석휘", startAt: "2026-09-15T10:00:00", endAt: "2026-09-15T16:00:00", position: "오픈" },
          { workerName: "인수연", startAt: "2026-09-15T16:00:00", endAt: "2026-09-15T22:00:00", position: "마감" },
        ],
        emptyShifts: [{ id: 92, startAt: "2026-09-19T16:00:00", endAt: "2026-09-19T22:00:00", position: "마감" }],
      },
    };

    const session = DaetaguhamApi.getSession();
    let stores = LIVE_MODE
      ? (session.stores || []).filter((store) =>
          store.myRole === (isOwner ? "OWNER" : "MANAGER") && (!store.memberStatus || store.memberStatus === "ACTIVE"))
      : SAMPLE_STORES;
    let storeKey = "";
    let overview = null;
    let notices = [];
    let loadVersion = 0;
    let messageBusy = false;

    const localISO = (date) => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    const todayISO = LIVE_MODE ? localISO(new Date()) : TODAY;
    const timePart = (dateTime) => dateTime.slice(11, 16);
    const hourValue = (dateTime) => {
      const [hour, minute] = timePart(dateTime).split(":").map(Number);
      return hour + minute / 60;
    };
    const storeInfo = () => stores.find((store) => String(store.storeId) === String(storeKey));
    const roleQuery = () => {
      const query = new URLSearchParams({ store: String(storeKey) });
      if (isOwner) query.set("role", "owner");
      return query.toString();
    };

    function showOverviewError(message = "") {
      const error = document.getElementById("overviewError");
      error.hidden = !message;
      error.textContent = message;
    }

    function renderStoreSwitch() {
      const box = document.getElementById("storeSwitch");
      if (stores.length < 2) { box.hidden = true; return; }
      box.hidden = false;
      box.setAttribute("role", "group");
      box.setAttribute("aria-label", "매장 선택");
      box.innerHTML = stores.map((store) =>
        `<button type="button" data-store-id="${store.storeId}" aria-pressed="${String(store.storeId) === String(storeKey)}">${escapeHTML(store.storeName)}</button>`
      ).join("");
    }

    function renderMessages() {
      const sorted = [...notices].sort((a, b) => a.noticeDate.localeCompare(b.noticeDate));
      document.getElementById("messageList").innerHTML = sorted.length ? sorted.map((notice) => `
        <div class="message-line">
          <time datetime="${notice.noticeDate}">${fmtDate(notice.noticeDate).split("(")[0]}</time>
          <p>${escapeHTML(notice.content)}</p>
          <button type="button" data-message-delete="${notice.id}" aria-label="${fmtDate(notice.noticeDate)} 전달사항 삭제">✕</button>
        </div>`).join("") : `<p class="message-empty">공유한 전달사항이 아직 없어요.</p>`;
    }

    function renderTimeline(shifts) {
      const assigned = shifts.filter((shift) => shift.workerName);
      document.getElementById("todayCount").textContent = `${overview.todayWorkerCount}명`;
      if (!assigned.length) {
        document.getElementById("todayTl").innerHTML = `<p class="empty">오늘 배정된 근무가 없어요.</p>`;
        document.getElementById("nowLine").textContent = "";
        return;
      }
      const minimum = Math.floor(Math.min(...assigned.map((shift) => hourValue(shift.startAt))));
      const maximum = Math.ceil(Math.max(...assigned.map((shift) => hourValue(shift.endAt))));
      const start = Math.max(0, Math.min(minimum, 12));
      const hours = Array.from({ length: 12 }, (_, index) => start + index);
      document.getElementById("todayTl").innerHTML = `
        <div class="tl-hours"><span></span>${hours.map((hour) => `<span>${hour}</span>`).join("")}</div>
        ${assigned.map((shift) => `
          <div class="tl-row">
            <span class="tl-who">${escapeHTML(shift.workerName)}</span>
            <div class="tl-blk band-${bandNo(shift.position)}" style="grid-column:${Math.floor(hourValue(shift.startAt)) - start + 2} / ${Math.min(Math.ceil(hourValue(shift.endAt)), start + 12) - start + 2}">${timePart(shift.startAt)}–${timePart(shift.endAt)}</div>
          </div>`).join("")}`;

      if (!LIVE_MODE) {
        const names = assigned.slice(0, 2).map((shift) => `${shift.workerName}님`).join(", ");
        document.getElementById("nowLine").textContent = `지금은 ${names}이 근무 중이에요.`;
        return;
      }
      const now = new Date();
      const working = assigned.filter((shift) => new Date(shift.startAt) <= now && now < new Date(shift.endAt));
      document.getElementById("nowLine").textContent = working.length
        ? `지금은 ${working.map((shift) => `${shift.workerName}님`).join(", ")}이 근무 중이에요.`
        : "현재 근무 중인 직원이 없어요.";
    }

    function renderEmptyShifts() {
      const shifts = overview.emptyShifts || [];
      const openSuffix = overview.openShiftCount ? ` · 급구 ${overview.openShiftCount}건 진행 중` : "";
      document.getElementById("openCount").textContent = `${shifts.length}개${openSuffix}`;
      document.getElementById("openList").innerHTML = shifts.length ? shifts.map((shift) => {
        const date = shift.startAt.slice(0, 10);
        const start = timePart(shift.startAt);
        const end = timePart(shift.endAt);
        const query = new URLSearchParams({
          store: String(storeKey), date, start, end, position: shift.position || "",
        });
        const href = isOwner
          ? `../owner/open-shift.html?${query.toString()}`
          : `schedule-bulk.html?store=${encodeURIComponent(storeKey)}`;
        return `
          <div class="list-item" style="cursor:default">
            <div class="grow">
              <p class="title num">${fmtDate(date)} ${start}–${end} ${escapeHTML(shift.position || "근무")}</p>
              <p class="desc">${isOwner ? "담당자를 지정하거나 급구로 사람을 구하세요" : "근무표에서 담당자를 지정해 주세요"}</p>
            </div>
            <a class="btn btn-sm" href="${href}">${isOwner ? "급구 등록" : "근무표 열기"}</a>
          </div>`;
      }).join("") : `<p class="empty">비어 있는 근무가 없어요</p>`;
    }

    function renderStore() {
      const store = storeInfo();
      document.querySelectorAll(".account-meta small").forEach((element) =>
        (element.textContent = `${store?.storeName || "매장"} 오늘`));
      renderStoreSwitch();

      const approval = document.getElementById("approvalBanner");
      approval.hidden = overview.pendingApprovalCount === 0;
      approval.href = `approvals.html?${roleQuery()}`;
      approval.querySelector(".grow").innerHTML = `승인할 근무 변경 ${overview.pendingApprovalCount}건<small>합의가 끝난 요청을 확인해 주세요</small>`;

      const application = document.getElementById("applyBanner");
      application.hidden = overview.pendingMemberCount === 0;
      application.href = `staff.html?${roleQuery()}`;
      application.querySelector(".grow").innerHTML = `참여 신청 ${overview.pendingMemberCount}명<small>매장에 참여할 직원을 확인해 주세요</small>`;

      renderMessages();
      renderTimeline(overview.todayShifts || []);
      renderEmptyShifts();

      const approvalCount = document.querySelector('[data-count-for="approvals"]');
      if (approvalCount) {
        approvalCount.textContent = overview.pendingApprovalCount;
        approvalCount.hidden = overview.pendingApprovalCount === 0;
      }
    }

    async function loadStore() {
      const version = ++loadVersion;
      showOverviewError();
      document.getElementById("messageList").innerHTML = `<p class="message-empty">전달사항을 불러오는 중이에요…</p>`;
      document.getElementById("todayTl").innerHTML = `<p class="empty">오늘 근무를 불러오는 중이에요…</p>`;
      document.getElementById("openList").innerHTML = `<p class="empty">미배정 근무를 불러오는 중이에요…</p>`;
      try {
        if (LIVE_MODE) {
          [overview, notices] = await Promise.all([
            DaetaguhamApi.request(`/stores/${storeKey}/summary`),
            DaetaguhamApi.request(`/stores/${storeKey}/notices`),
          ]);
        } else {
          overview = SAMPLE_OVERVIEWS[storeKey];
          notices = getStoreNotices(storeKey).filter((notice) => notice.noticeDate >= TODAY);
        }
        if (version !== loadVersion) return;
        renderStore();
      } catch (error) {
        if (version !== loadVersion) return;
        showOverviewError(error.message);
        document.getElementById("todayCount").textContent = "";
        document.getElementById("openCount").textContent = "";
      }
    }

    const messageSheet = document.getElementById("messageSheet");
    const messageDate = document.getElementById("messageDate");
    const messageText = document.getElementById("messageText");
    const messageError = document.getElementById("messageError");
    const messageSubmit = document.getElementById("messageSubmit");

    document.getElementById("messageBtn").addEventListener("click", () => {
      messageDate.value = todayISO;
      messageDate.min = todayISO;
      messageText.value = "";
      messageError.hidden = true;
      messageSheet.showModal();
    });
    document.getElementById("messageClose").addEventListener("click", () => messageSheet.close());
    document.getElementById("messageForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const date = messageDate.value;
      const content = messageText.value.trim();
      if (!date || !content) {
        messageError.textContent = "날짜와 전달할 내용을 모두 적어주세요.";
        messageError.hidden = false;
        return;
      }
      if (messageBusy) return;
      messageBusy = true;
      messageSubmit.disabled = true;
      messageSubmit.textContent = "공유 중…";
      try {
        const created = LIVE_MODE
          ? await DaetaguhamApi.request(`/stores/${storeKey}/notices`, {
              method: "POST", body: { noticeDate: date, content },
            })
          : { id: `notice-${Date.now()}`, noticeDate: date, content, createdByName: "김계원" };
        notices.push(created);
        if (!LIVE_MODE) saveStoreNotices(storeKey, notices);
        messageSheet.close();
        renderMessages();
        toast("직원 알림으로 전달사항을 공유했어요");
      } catch (error) {
        messageError.textContent = error.message;
        messageError.hidden = false;
      } finally {
        messageBusy = false;
        messageSubmit.disabled = false;
        messageSubmit.textContent = "직원에게 공유";
      }
    });

    document.getElementById("messageList").addEventListener("click", async (event) => {
      const button = event.target.closest("[data-message-delete]");
      if (!button || !confirm("이 전달사항을 삭제할까요?")) return;
      button.disabled = true;
      try {
        if (LIVE_MODE) {
          await DaetaguhamApi.request(`/notices/${button.dataset.messageDelete}`, { method: "DELETE" });
        }
        notices = notices.filter((notice) => String(notice.id) !== button.dataset.messageDelete);
        if (!LIVE_MODE) saveStoreNotices(storeKey, notices);
        renderMessages();
        toast("전달사항을 삭제했어요");
      } catch (error) {
        button.disabled = false;
        toast(error.message);
      }
    });

    document.getElementById("storeSwitch").addEventListener("click", (event) => {
      const button = event.target.closest("[data-store-id]");
      if (!button || button.dataset.storeId === String(storeKey)) return;
      storeKey = button.dataset.storeId;
      loadStore();
    });

    async function initialize() {
      document.getElementById("notificationLink").href = `../worker/notifications.html?role=${isOwner ? "owner" : "manager"}`;
      const date = new Date(`${todayISO}T00:00:00`);
      document.getElementById("todayDate").textContent = `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일 ${WEEKDAYS[date.getDay()]}요일`;
      if (!stores.length) {
        showOverviewError(isOwner ? "운영 중인 매장이 없어요." : "점장으로 승인된 매장이 없어요.");
        document.getElementById("messageBtn").disabled = true;
        return;
      }
      const requestedStore = params.get("store");
      storeKey = stores.some((store) => String(store.storeId) === requestedStore)
        ? requestedStore
        : String(stores[0].storeId);
      await loadStore();
    }

    initialize();
  </script>
</body>
</html>
