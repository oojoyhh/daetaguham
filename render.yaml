services:
  - type: web
    name: daetaguham-api-oojoyhh
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: daetaguham-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: daetaguham-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: daetaguham-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: daetaguham-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: daetaguham-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: daetaguham-production
      - key: CORS_ALLOWED_ORIGINS
        value: https://oojoyhh.github.io
      - key: HEALTH_SHOW_DETAILS
        value: never
      - key: DEMO_SEED_ENABLED
        value: "true"
      - key: DEMO_PASSWORD
        value: demo1234!

databases:
  - name: daetaguham-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: daetaguham
    user: daetaguham
    ipAllowList: []
