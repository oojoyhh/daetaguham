services:
  postgres:
    image: postgres:17-alpine
    container_name: daetaguham-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daetaguham}
      POSTGRES_USER: ${POSTGRES_USER:-daetaguham}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daetaguham}
    ports:
      - "${DAETAGUHAM_DB_PORT:-15432}:5432"
    volumes:
      - daetaguham-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  daetaguham-postgres-data:
