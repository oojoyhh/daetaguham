spring:
  application:
    name: daetaguham-backend
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:daetaguham}
    username: ${DB_USERNAME:daetaguham}
    password: ${DB_PASSWORD:daetaguham}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
  info:
    env:
      enabled: true

info:
  app:
    name: 대타구함 API
    description: 대타·교대·급구 요청과 근무표 반영을 연결하는 백엔드

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:8767,http://localhost:8767,http://127.0.0.1:8766,http://localhost:8766,https://oojoyhh.github.io}
  auth:
    jwt:
      issuer: ${JWT_ISSUER:daetaguham}
      secret: ${JWT_SECRET:dev-only-secret-change-before-deploy-2026}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
  requests:
    expiration:
      initial-delay: ${REQUEST_EXPIRATION_INITIAL_DELAY:PT30S}
      fixed-delay: ${REQUEST_EXPIRATION_FIXED_DELAY:PT1M}
