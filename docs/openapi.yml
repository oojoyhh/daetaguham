openapi: 3.0.3
info:
  title: 대타구함 API
  description: |
    알바 근무 대타·교대·급구 조율 서비스 **대타구함**의 RESTful API 명세서입니다.

    ## 인증 방식
    - 휴대폰 번호와 비밀번호로 로그인하면 JWT Access Token을 발급합니다.
    - 이후 모든 요청의 `Authorization` 헤더에 `Bearer {token}`을 포함합니다.
    - 알바생·점장·사장 역할은 계정이 아니라 **매장별**로 정해집니다.
      - 사장: `stores.owner_id`
      - 점장·알바생: `store_members.role` (MANAGER / WORKER)
    - 시스템 관리자는 두지 않습니다. 매장은 초대코드로만 들어가는 **비공개 공간**이고,
      문제가 생기면 사장·점장이 직원을 내보냅니다.

    ## 공통 규칙
    - 날짜/시간 형식: ISO 8601 (예: `2026-09-19T14:00:00`)
    - 페이지네이션: 목록 API에 `page`, `size` 쿼리 파라미터 지원 (선택). 응답은 `PagedResponse` 구조입니다.
    - 시간 겹침: 같은 사람의 근무는 **매장이 달라도** 시간이 겹치면 `409 Conflict`를 반환합니다.
    - 사장은 운영·관리 전용 액터입니다. 근무자로 배정하거나 대타·교대 요청/지원하지 않습니다.
    - 오픈·미들·마감은 기본 시간대입니다. 매장이 정의한 다른 시간대 이름도 허용합니다(최대 10자).
    - 목록의 이름·근무시간·상호 대타 횟수 등은 관계 조회 또는 서버 계산 값이며 ERD에 중복 저장하지 않습니다.

    ## 권한 요약
    | 기능 | 알바생 | 점장 | 사장 |
    |---|:-:|:-:|:-:|
    | 내 근무·대타·교대 요청/지원 | O | O | - |
    | 근무표 관리·승인·직원 관리 | - | O (담당 매장) | O (소유 매장) |
    | 매장 만들기·급구 등록·매장 설정·점장 임명 | - | - | O |
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: 로컬 개발 서버

tags:
  - name: Auth
    description: 로그인 및 회원가입
  - name: Me
    description: 내 정보 · 내 근무 · 근무 가능 시간 · 알림
  - name: Store
    description: 매장 등록 · 참여 · 직원 관리 · 매장 설정 · 전달사항
  - name: Shift
    description: 매장 근무표 · AI 후보 추천
  - name: Request
    description: 대타 · 교대 · 급구 요청과 지원
  - name: Approval
    description: 사장·점장의 근무 변경 승인

paths:
  # ==========================================
  # [Auth] 로그인 및 회원가입
  # ==========================================
  /auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      description: |
        휴대폰 번호로 가입합니다. 가입 직후에는 소속 매장이 없으며,
        초대코드로 매장에 참여하거나(`POST /stores/join`) 매장 등록을 신청합니다(`POST /stores`).
        (화면: login.html 회원가입 시트 → start.html)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, password]
              properties:
                name:
                  type: string
                  maxLength: 30
                  example: 김효주
                phone:
                  type: string
                  pattern: '^010-\d{4}-\d{4}$'
                  example: 010-1111-2222
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '201':
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 이미 가입된 휴대폰 번호
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      description: |
        휴대폰 번호와 비밀번호로 로그인합니다.
        응답의 `stores`로 첫 화면(알바생 홈 / 점장 오늘 / 사장 내 매장)을 결정합니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                  example: 010-1111-2222
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT Access Token
                  user:
                    $ref: '#/components/schemas/User'
                  stores:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyStore'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # [Me] 내 정보 · 내 근무
  # ==========================================
  /me:
    get:
      tags: [Me]
      summary: 내 정보 조회
      description: 내 계정 정보와 매장별 역할을 조회합니다. (화면 worker/me.html)
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  stores:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyStore'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/shifts:
    get:
      tags: [Me]
      summary: 내 근무 조회 (개인 캘린더)
      description: |
        소속 매장과 헬퍼로 간 매장의 **내 근무를 모두 합쳐서** 조회합니다. (화면 worker/home.html)
        `isHelper`, `status`는 저장된 값이 아니라 서버에서 계산합니다.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-09-01'
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-09-30'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyShift'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/requests:
    get:
      tags: [Me]
      summary: 내 요청·지원·받은 제안 조회
      description: 요청 게시판의 "내 활동" 탭에서 사용합니다. (화면 worker/board.html?tab=mine)
      parameters:
        - name: box
          in: query
          required: true
          schema:
            type: string
            enum: [sent, applied, received]
          description: 'sent: 내가 올린 요청 / applied: 내가 지원한 요청 / received: 받은 지정 제안'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/RequestSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/availabilities:
    get:
      tags: [Me]
      summary: 근무 가능 시간 조회
      description: 요일별 근무 가능 시간을 조회합니다. 행이 없는 요일은 근무 불가입니다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Availability'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Me]
      summary: 근무 가능 시간 저장
      description: |
        요일별 근무 가능 시간을 한 번에 덮어씁니다. 목록에 없는 요일은 근무 불가로 저장됩니다.
        AI 후보 추천(`GET /shifts/{shiftId}/candidates`)에 사용됩니다. (화면 worker/me.html)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 7
                  items:
                    $ref: '#/components/schemas/Availability'
      responses:
        '200':
          description: 저장 완료
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Availability'
        '400':
          description: 종료 시간이 시작 시간보다 빠르거나 같은 요일이 중복됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/store-notices:
    get:
      tags: [Me]
      summary: 내 매장 전달사항 조회
      description: |
        내가 속한 매장들의 전달사항을 모아서 오늘 것부터 날짜순으로 보여줍니다. (화면 worker/notifications.html)
        날짜가 지난 전달사항은 나오지 않습니다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreNotice'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/notifications:
    get:
      tags: [Me]
      summary: 알림 목록 조회
      description: 최신순으로 알림을 조회합니다. (화면 worker/notifications.html)
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      unreadCount:
                        type: integer
                        example: 2
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/notifications/{notificationId}/read:
    put:
      tags: [Me]
      summary: 알림 읽음 처리
      parameters:
        - $ref: '#/components/parameters/NotificationIdPath'
      responses:
        '204':
          description: 읽음 처리 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/notifications/read-all:
    put:
      tags: [Me]
      summary: 알림 모두 읽음 처리
      responses:
        '204':
          description: 모두 읽음 처리 완료
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # [Store] 매장 · 직원
  # ==========================================
  /stores:
    post:
      tags: [Store]
      summary: 매장 만들기
      description: |
        만든 사용자가 매장의 사장(owner)이 되고, **초대코드가 바로 발급**됩니다.
        매장은 초대코드로만 들어올 수 있는 비공개 공간이라 별도 심사가 없습니다. (화면 owner/store-new.html)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name:
                  type: string
                  maxLength: 50
                  example: 왕십리점
                category:
                  type: string
                  example: 아이스크림·디저트
                address:
                  type: string
                  description: 선택 입력
                  example: 서울 성동구 왕십리로 00
      responses:
        '201':
          description: 매장 생성 완료 (초대코드 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stores/my:
    get:
      tags: [Store]
      summary: 내 매장 목록 조회
      description: |
        내가 소유하거나 소속된 매장을 조회합니다. 사장·점장에게는 오늘 현황 요약이 함께 옵니다.
        (화면 owner/stores.html)
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/MyStore'
                    - type: object
                      properties:
                        summary:
                          $ref: '#/components/schemas/StoreSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stores/join:
    post:
      tags: [Store]
      summary: 초대코드로 매장 참여 신청
      description: |
        초대코드로 매장에 참여를 신청합니다. 상태는 PENDING이며 사장 또는 점장이 승인하면 ACTIVE가 됩니다.
        (화면 worker/join.html)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode:
                  type: string
                  pattern: '^[A-Z0-9]{6}$'
                  example: SEONG7
      responses:
        '201':
          description: 참여 신청 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 없는 초대코드
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 이미 소속됐거나 신청 대기 중인 매장
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stores/{storeId}:
    get:
      tags: [Store]
      summary: 매장 상세 조회
      description: 소유하거나 소속된 매장만 조회할 수 있습니다. 초대코드는 사장·점장에게만 보입니다.
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /stores/{storeId}/summary:
    get:
      tags: [Store]
      summary: 매장 오늘 현황 조회
      description: 오늘 근무자, 승인 대기 수, 참여 신청 수, 이번 주 빈 근무를 조회합니다. (화면 manager/today.html)
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StoreSummary'
                  - type: object
                    properties:
                      todayShifts:
                        type: array
                        items:
                          $ref: '#/components/schemas/Shift'
                      emptyShifts:
                        type: array
                        description: 이번 주 빈 근무 (worker가 없는 근무)
                        items:
                          $ref: '#/components/schemas/Shift'
        '403':
          $ref: '#/components/responses/Forbidden'

  /stores/{storeId}/settings:
    put:
      tags: [Store]
      summary: 매장 설정 변경 (사장)
      description: |
        대타·교대 승인 규칙을 변경합니다. **사장만** 변경할 수 있습니다.
        이미 승인 대기 중인 요청은 기존 상태를 유지하고, 이후 합의되는 요청부터 적용됩니다.
        (화면 owner/settings.html)
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvalRequired]
              properties:
                approvalRequired:
                  type: boolean
                  description: 'true: 승인 후 확정 / false: 합의 즉시 확정 (사장·점장에게 알림만)'
      responses:
        '200':
          description: 변경 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '403':
          description: 사장이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stores/{storeId}/invite-code:
    post:
      tags: [Store]
      summary: 초대코드 재발급 (사장)
      description: 기존 코드는 즉시 사용할 수 없게 됩니다. 이미 소속된 직원에게는 영향이 없습니다.
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
      responses:
        '200':
          description: 재발급 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  inviteCode:
                    type: string
                    example: K7Q2MX
        '403':
          $ref: '#/components/responses/Forbidden'

  /stores/{storeId}/members:
    get:
      tags: [Store]
      summary: 매장 직원·참여 신청 목록 조회 (사장·점장)
      description: 이번 달 근무시간과 대타해준 횟수는 서버에서 계산해 함께 반환합니다. (화면 manager/staff.html)
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MemberStatus'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/Forbidden'

  /stores/{storeId}/members/{userId}/status:
    put:
      tags: [Store]
      summary: 참여 신청 승인·거절 (사장·점장)
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, REJECTED]
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: PENDING 상태가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stores/{storeId}/members/{userId}/role:
    put:
      tags: [Store]
      summary: 점장 임명·해제 (사장)
      description: '**사장만** 가능합니다. (화면 owner/settings.html)'
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/MemberRole'
      responses:
        '200':
          description: 변경 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '403':
          description: 사장이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stores/{storeId}/members/{userId}:
    delete:
      tags: [Store]
      summary: 직원 내보내기 (사장·점장)
      description: |
        멤버 상태를 LEFT로 바꿉니다. 과거 근무·요청 기록은 그대로 둡니다.
        앞으로 잡힌 근무는 지우지 않고 `worker_id`만 비워 **담당자 미정(빈 근무)** 으로 바꿔서,
        사장이 급구로 바로 사람을 구할 수 있게 합니다. 그 근무에 걸려 있던 대타·교대 요청은 CANCELED가 되고 관련자에게 알림이 갑니다.
        점장은 다른 점장을 내보낼 수 없습니다.
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: 내보내기 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  emptiedShiftCount:
                    type: integer
                    description: 담당자 미정으로 바뀐 앞으로의 근무 수
                    example: 7
                  canceledRequestCount:
                    type: integer
                    description: 함께 취소된 진행 중 요청 수
                    example: 1
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /stores/{storeId}/notices:
    get:
      tags: [Store]
      summary: 매장 전달사항 조회
      description: |
        근무표와 분리된 매장 공지입니다. 오늘 이후 날짜의 전달사항만 날짜순으로 반환합니다. (화면 manager/today.html)
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreNotice'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Store]
      summary: 매장 전달사항 작성 (사장·점장)
      description: 저장하면 이 매장 직원들의 알림 화면에 바로 나타납니다.
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreNoticeWriteRequest'
      responses:
        '201':
          description: 작성 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreNotice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /notices/{noticeId}:
    delete:
      tags: [Store]
      summary: 매장 전달사항 삭제 (사장·점장)
      parameters:
        - name: noticeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 31
      responses:
        '204':
          description: 삭제 완료
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # [Shift] 근무표
  # ==========================================
  /stores/{storeId}/shifts:
    get:
      tags: [Shift]
      summary: 매장 근무표 조회
      description: 기간 안의 매장 근무를 조회합니다. 소속 직원 모두 조회할 수 있습니다. (화면 manager/schedule.html)
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-09-14'
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-09-20'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shift'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Shift]
      summary: 근무 등록 (사장·점장)
      description: |
        근무자를 비워두면 빈 근무로 저장됩니다.
        근무자의 다른 근무(다른 매장 포함)와 시간이 겹치면 409를 반환합니다.
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftWriteRequest'
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/TimeConflict'

  /stores/{storeId}/shift-templates:
    get:
      tags: [Shift]
      summary: 매장 시간대 프리셋 조회
      description: |
        이 매장에서 쓰는 시간대입니다. 근무표를 짤 때 이 시간대가 표의 줄이 되고, 칸에 사람을 넣으면 이 시간으로 근무가 만들어집니다.
        이름·시간·개수는 매장이 정합니다. 매장을 만들면 오픈 10:00-16:00, 미들 12:00-18:00, 마감 16:00-22:00 세 개가 기본으로 들어갑니다. (화면 manager/schedule-bulk.html)
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShiftTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Shift]
      summary: 매장 시간대 변경 (사장·점장)
      description: |
        보낸 목록으로 통째로 바꿉니다. 시간대를 더 만들거나 지울 수 있습니다.
        이미 저장된 근무의 시간은 바뀌지 않습니다 (shifts에 시간과 시간대 이름을 복사해 두기 때문).
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ShiftTemplateWriteRequest'
      responses:
        '200':
          description: 변경 완료
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShiftTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /stores/{storeId}/shifts/bulk:
    post:
      tags: [Shift]
      summary: 근무표 한 번에 저장 (사장·점장)
      description: |
        한 달(또는 정한 기간) 근무표를 통째로 저장합니다. 매장 근무표는 보통 달 단위로 짭니다. (화면 manager/schedule-bulk.html)
        - from ~ to 사이 이 매장 근무를 보낸 목록과 대조합니다. workerId·startAt·endAt·position이 같은 행은 기존 id를 유지하며, 참조되지 않은 행만 삭제·추가합니다. 동일한 값의 행이 여러 개라면 개수까지 대조합니다.
        - 같은 날 같은 시간대에 여러 명이 들어가면 사람 수만큼 근무가 만들어집니다.
        - 한 칸이라도 근무자의 근무 시간이 겹치면(다른 매장 근무, 또는 같은 날 시간이 겹치는 다른 시간대) 아무것도 저장하지 않고 409를 반환하며, 겹친 칸을 conflicts로 알려줍니다.
        - shift_requests.shift_id, application_offer_shifts.shift_id, request_applications.selected_offer_shift_id에 참조된 근무는 요청 상태와 무관하게 보존합니다. 제출 목록에서 해당 행이 빠지거나 값이 달라지면 409 SHIFT_REFERENCED로 전체 저장을 거부합니다. 조용히 남겨 중복 생성하지 않습니다.
        - 초기화는 shifts: []로 저장합니다. 기간 내 참조된 근무가 있으면 동일하게 409로 거부하며 기존 근무표는 그대로 유지합니다.
        - 근무자를 비운 칸은 빈 근무로 저장되어 사장이 급구로 올릴 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftBulkRequest'
      responses:
        '200':
          description: 저장 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftBulkResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 시간 겹침 또는 참조된 근무 변경·삭제로 전체 저장하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftBulkConflict'

  /stores/{storeId}/shifts/import:
    post:
      tags: [Shift]
      summary: 엑셀·CSV 붙여넣기 해석 (사장·점장)
      description: |
        매장에서 쓰던 근무표 표를 그대로 붙여넣으면 근무표 칸으로 바꿔 줍니다. 저장은 하지 않고 미리보기만 돌려줍니다. (화면 manager/schedule-bulk.html)
        각 줄의 첫 칸은 시간대 이름(오픈·미들·마감 등), 그다음 7칸은 월~일 순서로 그날 일하는 사람 이름입니다.
        한 칸에 여러 명이면 공백·쉼표·가운뎃점으로 나눠 적습니다. '미정'이나 '?'는 담당자 미정(빈 근무)으로 봅니다.
        칸 구분자는 탭 또는 쉼표를 모두 받고, 요일 머리글 줄과 매장에 없는 시간대 줄은 건너뜁니다.
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftImportRequest'
      responses:
        '200':
          description: 해석 완료 (저장되지 않음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /shifts/{shiftId}:
    put:
      tags: [Shift]
      summary: 근무 수정 (사장·점장)
      description: 요청·교대 후보·선택 결과에 참조된 근무의 근무자·시간·포지션 변경은 409 SHIFT_REFERENCED로 거부합니다. 값이 같은 저장은 허용합니다. 요청 확정 전용 트랜잭션에서의 근무자 변경은 이 제한의 대상이 아닙니다.
      parameters:
        - $ref: '#/components/parameters/ShiftIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftWriteRequest'
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: TIME_CONFLICT (시간 겹침) 또는 SHIFT_REFERENCED (참조된 근무 변경)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Shift]
      summary: 근무 삭제 (사장·점장)
      description: shift_requests.shift_id, application_offer_shifts.shift_id, request_applications.selected_offer_shift_id에 참조되지 않은 근무만 삭제합니다. 취소·완료된 요청도 기록이 남으므로 참조된 근무는 409 SHIFT_REFERENCED로 거부하고 어떤 행도 변경하지 않습니다.
      parameters:
        - $ref: '#/components/parameters/ShiftIdPath'
      responses:
        '204':
          description: 삭제 완료
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 요청·교대 후보·선택 결과에 참조되어 삭제할 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SHIFT_REFERENCED
                message: 요청 기록에 연결된 근무는 삭제할 수 없습니다.

  /shifts/{shiftId}/candidates:
    get:
      tags: [Shift]
      summary: 대타·교대 부탁할 동료 AI 추천
      description: |
        "한 명에게 부탁" 화면에서 부탁할 동료를 추천합니다. (화면 worker/request-new.html)

        **추천 방식**
        1. 규칙 필터: 범위 안 ACTIVE 직원 중 시간이 겹치지 않는 사람 (교대는 같은 매장만)
        2. 점수: 근무 가능 시간 일치, 이번 주 근무시간이 적은 순, 나를 도와준 횟수
        3. AI 설명: 순위별 추천 사유를 한 줄로 생성 (판정은 규칙이 하고, AI는 설명만 담당)
      parameters:
        - $ref: '#/components/parameters/ShiftIdPath'
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [COVER, EXCHANGE]
        - name: scope
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RequestScope'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
            maximum: 20
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateList'
        '403':
          description: 본인 근무가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stores/{storeId}/candidates:
    get:
      tags: [Shift]
      summary: 급구 후보 AI 추천 (사장)
      description: |
        급구를 올리기 전에 해당 시간에 일할 수 있는 후보를 추천합니다. (화면 owner/open-shift.html)
        추천 방식은 `GET /shifts/{shiftId}/candidates`와 같고, 최근 급구 참여가 많은 사람은 점수를 낮춥니다.
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
        - name: startAt
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: '2026-09-25T12:00:00'
        - name: endAt
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: '2026-09-25T20:00:00'
        - name: scope
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/RequestScope'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateList'
        '403':
          description: 사장이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==========================================
  # [Request] 대타 · 교대 · 급구
  # ==========================================
  /requests:
    post:
      tags: [Request]
      summary: 대타·교대 요청 올리기
      description: |
        내 근무에 대해 대타 또는 교대 요청을 올립니다. (화면 worker/request-new.html)
        - `mode: DIRECT`면 `targetUserId`가 필요하고, 상대의 지원 행이 PROPOSED 상태로 함께 만들어집니다.
        - 지정 교대면 `targetShiftIds`(바꿀 후보인 상대 근무, 1개 이상)도 필요합니다.
        - 공개 교대면 `availableDates`(요청자가 대신 일할 수 있는 날, 1일 이상)가 필요합니다.
          원래 근무일, 이미 지난 날, 요청자가 이미 근무가 있는 날은 넣을 수 없습니다.
        - 교대는 `scope`가 항상 STORE입니다.
        - `mode: PUBLIC`이면 범위 안에서 시간이 겹치지 않는 직원에게 알림을 보냅니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCreateRequest'
      responses:
        '201':
          description: 요청 등록 완료 (OPEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
        '400':
          description: 교대인데 OWNER_STORES 범위, 공개 교대인데 availableDates 누락, 지정인데 상대 누락 등 유효성 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 본인 근무가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 이미 진행 중인 요청이 있거나, 이미 시작한 근무
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Request]
      summary: 요청 게시판 조회
      description: |
        내가 볼 수 있는 모집 중(OPEN) 요청을 조회합니다. (화면 worker/board.html)
        공개 범위 밖이거나 **내 근무와 시간이 겹치는 요청은 서버에서 제외**합니다.
        공개 교대는 요청자가 고른 `availableDates` 중 **내 근무가 있는 날이 하나라도 있을 때만** 보입니다.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RequestType'
        - name: storeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/RequestSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stores/{storeId}/open-shifts:
    post:
      tags: [Request]
      summary: 급구 등록 (사장)
      description: |
        **사장만** 급구를 올릴 수 있습니다. 빈 근무(shifts)와 급구 요청(shift_requests)을 함께 만들고,
        선택한 후보에게 OPEN_SHIFT_POSTED 알림을 한 번에 보냅니다. (화면 owner/open-shift.html)
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenShiftCreateRequest'
      responses:
        '201':
          description: 급구 등록 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: '#/components/schemas/RequestDetail'
                  notifiedCount:
                    type: integer
                    example: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 사장이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /requests/{requestId}:
    get:
      tags: [Request]
      summary: 요청 상세 조회
      description: |
        보는 사람에 따라 응답이 다릅니다.
        - 요청자: `applications` 전체 (지원자별 주고받은 대타 기록 포함) — 화면 worker/request.html
        - 지원자·제안 받은 사람: `myApplication`만 — 화면 worker/apply.html
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /requests/{requestId}/cancel:
    put:
      tags: [Request]
      summary: 요청 취소
      description: 요청자만 OPEN 또는 PENDING_APPROVAL 상태에서 취소할 수 있습니다. 지원자 전원에게 알림이 갑니다.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: 취소 완료 (CANCELED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidState'

  /requests/{requestId}/proposals:
    post:
      tags: [Request]
      summary: 다른 사람에게 다시 부탁 / 공개로 전환
      description: |
        지정 제안이 거절(DECLINED)된 뒤 사용합니다.
        - `targetUserId`를 보내면 그 사람에게 새 PROPOSED 제안을 만듭니다.
        - `switchToPublic: true`면 mode를 PUBLIC으로 바꾸고 범위 안 직원에게 알림을 보냅니다.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetUserId:
                  type: integer
                  format: int64
                targetShiftIds:
                  type: array
                  description: 교대일 때 바꿀 후보인 상대 근무 (1개 이상)
                  items:
                    type: integer
                    format: int64
                availableDates:
                  type: array
                  description: 공개 교대로 전환할 때 대신 일할 수 있는 날 (1일 이상)
                  items:
                    type: string
                    format: date
                switchToPublic:
                  type: boolean
                  default: false
                scope:
                  $ref: '#/components/schemas/RequestScope'
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidState'

  /requests/{requestId}/applications:
    post:
      tags: [Request]
      summary: 지원하기 (교대는 내 근무 제안)
      description: |
        공개 요청이나 급구에 지원합니다. (화면 worker/apply.html)
        - 교대면 `offeredShiftIds`(내놓을 내 근무, 달력에서 여러 개 선택)가 필요합니다.
          요청자의 `availableDates`에 있는 날짜의 같은 매장 근무만 넣을 수 있습니다.
        - 철회했던 요청에 다시 지원하면 기존 행을 APPLIED로 재사용합니다.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                offeredShiftIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  example: [107, 112]
                message:
                  type: string
                  maxLength: 60
                  example: 저녁 괜찮아요!
      responses:
        '201':
          description: 지원 완료 (APPLIED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: 교대인데 offeredShiftIds가 없거나, 다른 매장 근무이거나, 요청자가 안 되는 날짜의 근무
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 공개 범위 밖이거나 본인 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 시간이 겹치거나, 이미 지원했거나, 모집 중이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{applicationId}/response:
    put:
      tags: [Request]
      summary: 지정 제안 수락·거절
      description: |
        제안 받은 사람만 PROPOSED 상태에서 응답할 수 있습니다. (화면 worker/home.html 교대 제안 시트)
        수락하면 `PUT /requests/{requestId}/selection`과 같은 확정 로직을 탑니다.
      parameters:
        - $ref: '#/components/parameters/ApplicationIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept:
                  type: boolean
                offerShiftId:
                  type: integer
                  format: int64
                  description: 지정 교대를 수락할 때 필수. 요청자가 제안한 내 근무 중 실제로 바꿀 하나
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: PROPOSED 상태가 아니거나 시간이 겹침
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{applicationId}/withdraw:
    put:
      tags: [Request]
      summary: 지원 철회
      description: 지원자 본인이 APPLIED 상태(선택되기 전)에서만 철회할 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/ApplicationIdPath'
      responses:
        '200':
          description: 철회 완료 (WITHDRAWN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidState'

  /requests/{requestId}/selection:
    put:
      tags: [Request]
      summary: 지원자 선택
      description: |
        공개 요청은 선착순이 아니라 **요청자가 지원자를 고릅니다**. (화면 worker/request.html)
        급구는 사장이 고릅니다.
        - 승인 필요 매장의 대타·교대 → PENDING_APPROVAL (사장·점장에게 APPROVAL_NEEDED 알림)
        - 통보만 하는 매장 또는 급구 → 바로 CONFIRMED (확정 트랜잭션 실행)

        **확정 트랜잭션**
        1. 선택된 사람의 시간 겹침 재검사 (모든 매장)
        2. 대타·급구: 근무자 변경 / 교대: 원래 근무와 `offerShiftId` 근무의 근무자 맞바꿈
        3. 나머지 지원 NOT_SELECTED, 같은 근무의 다른 진행 중 요청 CANCELED
        4. 관련자에게 CONFIRMED 알림
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId]
              properties:
                applicationId:
                  type: integer
                  format: int64
                offerShiftId:
                  type: integer
                  format: int64
                  description: 교대일 때 필수. 지원자가 내놓은 근무(offeredShifts) 중 실제로 바꿀 하나
      responses:
        '200':
          description: 선택 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
        '403':
          description: 요청자(급구는 사장)가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 모집 중이 아니거나, 선택한 사람의 시간이 새로 겹침
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==========================================
  # [Approval] 근무 변경 승인
  # ==========================================
  /stores/{storeId}/approvals:
    get:
      tags: [Approval]
      summary: 승인 대기 목록 조회 (사장·점장)
      description: |
        PENDING_APPROVAL 상태의 대타·교대를 변경 전후 근무표, 자동 확인 결과와 함께 조회합니다.
        (화면 manager/approvals.html, 사장은 ?role=owner)
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalItem'
        '403':
          $ref: '#/components/responses/Forbidden'

  /requests/{requestId}/approval:
    put:
      tags: [Approval]
      summary: 승인·반려 (사장·점장)
      description: |
        - APPROVE: 확정 트랜잭션을 실행하고 CONFIRMED가 됩니다.
        - REJECT: `comment` 필수. 선택된 지원만 REJECTED가 되고 요청은 **OPEN으로 돌아가** 요청자가 다른 사람을 고를 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVE, REJECT]
                comment:
                  type: string
                  maxLength: 200
                  description: REJECT일 때 필수
                  example: 이번 주 근무가 너무 많아요. 다른 분으로 부탁해요.
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
        '400':
          description: 반려 사유 누락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 승인 대기 상태가 아니거나, 승인 시점에 시간이 겹침
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    # -------------------------------------------------------
    # 페이지네이션 공통 응답 래퍼
    # -------------------------------------------------------
    PagedResponse:
      type: object
      description: 페이지네이션이 적용된 목록 응답 공통 구조. content 필드에 실제 데이터 배열이 담깁니다.
      properties:
        content:
          type: array
          description: 실제 데이터 목록
          items: {}
        totalElements:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 5
        page:
          type: integer
          description: 현재 페이지 번호 (1부터 시작)
          example: 1
        size:
          type: integer
          example: 10

    # -------------------------------------------------------
    # 상태값 (DBML Enum과 동일)
    # -------------------------------------------------------
    MemberRole:
      type: string
      enum: [MANAGER, WORKER]
    MemberStatus:
      type: string
      enum: [PENDING, ACTIVE, REJECTED, LEFT]
    RequestType:
      type: string
      enum: [COVER, EXCHANGE, OPEN_SHIFT]
      description: 'COVER: 대타 / EXCHANGE: 교대 / OPEN_SHIFT: 급구'
    RequestMode:
      type: string
      enum: [PUBLIC, DIRECT]
      description: 'PUBLIC: 모두에게 올리기 / DIRECT: 한 명에게 부탁'
    RequestScope:
      type: string
      enum: [STORE, OWNER_STORES]
      description: 'STORE: 이 매장 / OWNER_STORES: 같은 사장 매장 전체'
    RequestStatus:
      type: string
      enum: [OPEN, PENDING_APPROVAL, CONFIRMED, CANCELED, EXPIRED]
    ApplicationStatus:
      type: string
      enum: [PROPOSED, APPLIED, SELECTED, DECLINED, NOT_SELECTED, WITHDRAWN, REJECTED]

    # -------------------------------------------------------
    # 사용자 · 매장
    # -------------------------------------------------------
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: 김효주
        phone:
          type: string
          example: 010-1111-2222
        createdAt:
          type: string
          format: date-time

    MyStore:
      type: object
      description: 내 기준 매장 정보 (내 역할 포함)
      properties:
        storeId:
          type: integer
          format: int64
          example: 12
        storeName:
          type: string
          example: 성수점
        myRole:
          type: string
          enum: [OWNER, MANAGER, WORKER]
          description: 'OWNER는 stores.owner_id로, 나머지는 store_members.role로 결정'
        memberStatus:
          $ref: '#/components/schemas/MemberStatus'
        joinedAt:
          type: string
          format: date-time
          nullable: true
          description: store_members.joined_at에서 반환하는 해당 매장 입사 시점. 사장 또는 승인 전 소속은 null.
          example: '2023-03-01T10:00:00'

    Store:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 12
        ownerId:
          type: integer
          format: int64
        ownerName:
          type: string
          example: 김효주
        name:
          type: string
          example: 성수점
        category:
          type: string
          example: 아이스크림·디저트
        address:
          type: string
        inviteCode:
          type: string
          nullable: true
          description: 사장·점장에게만 반환
          example: SEONG7
        approvalRequired:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time

    StoreSummary:
      type: object
      description: 매장 오늘 현황 (서버 계산)
      properties:
        todayWorkerCount:
          type: integer
          example: 3
        pendingApprovalCount:
          type: integer
          example: 3
        pendingMemberCount:
          type: integer
          example: 1
        emptyShiftCount:
          type: integer
          description: 이번 주 빈 근무 수
          example: 1
        openShiftCount:
          type: integer
          description: 모집 중인 급구 수
          example: 0

    Member:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        name:
          type: string
          example: 이진호
        phone:
          type: string
          description: 같은 매장 사장·점장에게만 반환
          example: 010-2222-3131
        role:
          $ref: '#/components/schemas/MemberRole'
        status:
          $ref: '#/components/schemas/MemberStatus'
        requestedAt:
          type: string
          format: date-time
        joinedAt:
          type: string
          format: date-time
          nullable: true
        monthHours:
          type: number
          description: 이번 달 근무시간 (서버 계산)
          example: 64
        monthShiftCount:
          type: integer
          example: 10
        upcomingShiftCount:
          type: integer
          minimum: 0
          description: 이 매장에서 시작 시각이 현재보다 늦은 해당 직원의 근무 수. 내보내기 시 담당자 미정으로 바뀔 건수 안내용이며 shifts 조회로 계산.
          example: 3
        coverCount:
          type: integer
          description: 확정된 대타를 해준 횟수 (서버 계산)
          example: 4

    Availability:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0=일 ~ 6=토
          example: 6
        startTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '10:00'
        endTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '22:00'

    # -------------------------------------------------------
    # 근무
    # -------------------------------------------------------
    Shift:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 108
        storeId:
          type: integer
          format: int64
          example: 12
        workerId:
          type: integer
          format: int64
          nullable: true
          description: null이면 빈 근무
        workerName:
          type: string
          nullable: true
          example: 김계원
        startAt:
          type: string
          format: date-time
          example: '2026-09-19T14:00:00'
        endAt:
          type: string
          format: date-time
          example: '2026-09-19T22:00:00'
        position:
          type: string
          example: 마감
        isHelper:
          type: boolean
          description: 근무자가 이 매장 소속이 아닌 헬퍼인지 (서버 계산)
        openRequest:
          $ref: '#/components/schemas/RequestBrief'

    MyShift:
      allOf:
        - $ref: '#/components/schemas/Shift'
        - type: object
          properties:
            storeName:
              type: string
              example: 성수점
            status:
              type: string
              enum: [UPCOMING, IN_PROGRESS, DONE]
              description: 현재 시각 기준 (서버 계산)

    ShiftWriteRequest:
      type: object
      required: [startAt, endAt]
      description: 종료는 시작보다 늦어야 합니다. 근무자는 ACTIVE 직원(점장·알바생·허용된 헬퍼)이며 사장은 제외합니다.
      properties:
        workerId:
          type: integer
          format: int64
          nullable: true
          description: 비워두면 빈 근무
        startAt:
          type: string
          format: date-time
          example: '2026-09-18T16:00:00'
        endAt:
          type: string
          format: date-time
          example: '2026-09-18T22:00:00'
        position:
          type: string
          minLength: 1
          maxLength: 10
          description: 매장이 정의한 시간대 이름의 스냅샷. 오픈·미들·마감 외 이름도 허용합니다.

    StoreNotice:
      type: object
      description: 매장 전달사항 하나
      properties:
        id:
          type: integer
          format: int64
          example: 31
        storeId:
          type: integer
          format: int64
          example: 12
        storeName:
          type: string
          description: 여러 매장을 묶어 볼 때 어느 매장인지
          example: 성수점
        noticeDate:
          type: string
          format: date
          example: '2026-09-16'
        content:
          type: string
          example: 오후 2시 재료 입고 예정이에요. 냉동고 앞을 비워주세요.
        createdByName:
          type: string
          example: 김계원
        createdAt:
          type: string
          format: date-time
          example: '2026-09-15T10:12:00'

    StoreNoticeWriteRequest:
      type: object
      required: [noticeDate, content]
      properties:
        noticeDate:
          type: string
          format: date
          description: 오늘 이후 날짜만 받습니다
          example: '2026-09-16'
        content:
          type: string
          maxLength: 160
          example: 오후 2시 재료 입고 예정이에요. 냉동고 앞을 비워주세요.

    ShiftTemplate:
      type: object
      description: 매장에서 쓰는 시간대 하나
      properties:
        id:
          type: integer
          format: int64
          example: 3
        name:
          type: string
          example: 마감
        startTime:
          type: string
          example: '16:00'
        endTime:
          type: string
          example: '22:00'
        requiredCount:
          type: integer
          description: 이 시간대에 필요한 사람 수
          example: 2

    ShiftTemplateWriteRequest:
      type: object
      required: [name, startTime, endTime]
      description: 매장 내 이름 중복 불가. 종료는 시작보다 늦어야 합니다.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 10
          pattern: '^[^|]+$'
          example: 마감
        startTime:
          type: string
          example: '16:00'
        endTime:
          type: string
          example: '22:00'
        requiredCount:
          type: integer
          minimum: 1
          maximum: 9
          default: 1
          example: 2

    ShiftBulkRequest:
      type: object
      required: [from, to, shifts]
      properties:
        from:
          type: string
          format: date
          example: '2026-10-01'
        to:
          type: string
          format: date
          example: '2026-10-31'
        shifts:
          type: array
          description: 이 기간에 들어갈 근무 전체 (한 달이면 100건 안팎)
          items:
            $ref: '#/components/schemas/ShiftBulkItem'

    ShiftBulkItem:
      type: object
      required: [date, position]
      properties:
        workerId:
          type: integer
          format: int64
          nullable: true
          description: 비워두면 빈 근무 (급구 대상)
        date:
          type: string
          format: date
          example: '2026-10-22'
        position:
          type: string
          description: 시간대 이름. 매장 시간대(shift-templates)의 시간이 그대로 들어갑니다
          minLength: 1
          maxLength: 10

    ShiftBulkResult:
      type: object
      properties:
        created:
          type: integer
          description: 새로 만든 근무 수
          example: 102
        deleted:
          type: integer
          description: 지운 근무 수
          example: 98
        emptyShiftIds:
          type: array
          description: 근무자가 없는 빈 근무 (급구로 올릴 수 있음)
          items:
            type: integer
            format: int64

    ShiftBulkConflict:
      type: object
      description: 시간 겹침 또는 참조된 근무 변경·삭제로 하나도 저장하지 않았을 때
      properties:
        code:
          type: string
          enum: [TIME_CONFLICT, SHIFT_REFERENCED]
          example: TIME_CONFLICT
        message:
          type: string
          example: 겹치는 근무가 있어 저장하지 않았어요.
        conflicts:
          type: array
          description: TIME_CONFLICT의 겹침 목록. SHIFT_REFERENCED일 때는 빈 배열.
          items:
            type: object
            properties:
              workerId:
                type: integer
                format: int64
              workerName:
                type: string
                example: 이진호
              date:
                type: string
                format: date
                example: '2026-10-22'
              storeName:
                type: string
                description: 이미 근무가 잡혀 있는 매장
                example: 건대점
              startAt:
                type: string
                format: date-time
                example: '2026-10-22T18:00:00'
              endAt:
                type: string
                format: date-time
                example: '2026-10-22T22:00:00'
        referencedShiftIds:
          type: array
          description: SHIFT_REFERENCED일 때 변경·삭제가 차단된 기존 근무 id. TIME_CONFLICT일 때는 빈 배열. 기존 FK를 조회한 응답 값이며 별도 DB 컬럼이 아님.
          items:
            type: integer
            format: int64

    ShiftImportRequest:
      type: object
      required: [from, text]
      properties:
        from:
          type: string
          format: date
          description: 넣을 주의 월요일 (붙여넣는 표는 한 주치라서 어느 주에 넣을지 함께 보냅니다)
          example: '2026-10-19'
        text:
          type: string
          description: 엑셀에서 복사한 표 (탭 또는 쉼표로 나뉜 줄들). 줄 = 시간대, 칸 = 월~일
          example: "\t월\t화\t수\t목\t금\t토\t일\n오픈\t\t\t김계원\n미들\t김민\t이진호\t이진호\t김민\t박유진\t박유진\t김민"

    ShiftImportResult:
      type: object
      properties:
        items:
          type: array
          description: 알아본 근무 칸
          items:
            $ref: '#/components/schemas/ShiftBulkItem'
        unknownNames:
          type: array
          description: 이 매장 직원이 아니어서 건너뛴 이름
          items:
            type: string
            example: 홍길동
        skippedLines:
          type: integer
          description: 알아보지 못해 건너뛴 줄 수
          example: 1

    Candidate:
      type: object
      description: AI 후보 추천 결과 한 명
      properties:
        userId:
          type: integer
          format: int64
        name:
          type: string
          example: 인수연
        storeName:
          type: string
          example: 성수점
        score:
          type: integer
          description: 규칙 기반 점수 (0~100)
          example: 92
        weekHours:
          type: number
          example: 6
        gaveToMe:
          type: integer
          description: 이 사람이 요청자를 도와준 횟수 (대타·교대 추천에서만)
          example: 3
        aiReason:
          type: string
          description: AI가 생성한 한 줄 추천 사유
          example: 이번 주 근무가 가장 적고, 금요일 종일 가능해요
        shifts:
          type: array
          description: 교대 추천일 때 이 사람이 내놓을 수 있는 근무
          items:
            $ref: '#/components/schemas/Shift'

    CandidateList:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        excludedCount:
          type: integer
          description: 시간이 겹치거나 근무 불가라서 제외된 인원
          example: 3

    # -------------------------------------------------------
    # 요청 · 지원
    # -------------------------------------------------------
    RequestCreateRequest:
      type: object
      required: [type, shiftId, mode]
      properties:
        type:
          type: string
          enum: [COVER, EXCHANGE]
        shiftId:
          type: integer
          format: int64
          description: 넘기거나 바꿀 내 근무
          example: 108
        mode:
          $ref: '#/components/schemas/RequestMode'
        scope:
          $ref: '#/components/schemas/RequestScope'
        targetUserId:
          type: integer
          format: int64
          description: DIRECT일 때 필수
        targetShiftIds:
          type: array
          description: DIRECT 교대일 때 필수 - 바꿀 후보인 상대 근무 (여러 개 가능)
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int64
          example: [201, 202]
        availableDates:
          type: array
          description: PUBLIC 교대일 때 필수 - 요청자가 대신 일할 수 있는 날 (달력에서 여러 날 선택)
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: date
          example: ['2026-09-16', '2026-09-22', '2026-09-27']
        reason:
          type: string
          maxLength: 100
          example: 갑자기 가족 행사가 생겼어요

    OpenShiftCreateRequest:
      type: object
      required: [startAt, endAt, scope, notifyUserIds]
      properties:
        startAt:
          type: string
          format: date-time
          example: '2026-09-25T12:00:00'
        endAt:
          type: string
          format: date-time
          example: '2026-09-25T20:00:00'
        position:
          type: string
          minLength: 1
          maxLength: 10
          description: 선택 입력. 입력하면 shifts.position의 1~10자 이름으로 저장하며, 생략하면 NULL. 오픈·미들·마감으로 고정하지 않음.
          example: 미들
        scope:
          $ref: '#/components/schemas/RequestScope'
        message:
          type: string
          maxLength: 100
          example: 추석 당일이라 손님이 많을 것 같아요. 도와주세요!
        notifyUserIds:
          type: array
          description: 알림을 보낼 후보 (AI 추천 목록에서 선택)
          minItems: 1
          items:
            type: integer
            format: int64
          example: [5, 21, 4]

    RequestBrief:
      type: object
      nullable: true
      description: 근무에 걸린 진행 중 요청 요약 (없으면 null)
      properties:
        requestId:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/RequestType'
        status:
          $ref: '#/components/schemas/RequestStatus'
        applicantCount:
          type: integer
          example: 3

    RequestSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 3021
        type:
          $ref: '#/components/schemas/RequestType'
        mode:
          $ref: '#/components/schemas/RequestMode'
        scope:
          $ref: '#/components/schemas/RequestScope'
        status:
          $ref: '#/components/schemas/RequestStatus'
        storeName:
          type: string
          example: 성수점
        requesterName:
          type: string
          description: 대타·교대는 근무자 본인, 급구는 매장 사장의 이름.
          example: 권예리
        shift:
          $ref: '#/components/schemas/Shift'
        applicantCount:
          type: integer
          example: 3
        availableDates:
          type: array
          description: 공개 교대에서 요청자가 대신 일할 수 있는 날 (그 외 유형은 빈 배열)
          items:
            type: string
            format: date
          example: ['2026-09-16', '2026-09-22', '2026-09-27']
        myApplicationStatus:
          type: string
          allOf:
            - $ref: '#/components/schemas/ApplicationStatus'
          nullable: true
          description: 내가 지원한 상태 (내 활동 탭)
        createdAt:
          type: string
          format: date-time

    RequestDetail:
      allOf:
        - $ref: '#/components/schemas/RequestSummary'
        - type: object
          properties:
            reason:
              type: string
              nullable: true
            approvalRequired:
              type: boolean
              description: 이 요청이 확정되려면 승인이 필요한지 (매장 설정 + 유형으로 계산)
            confirmedAt:
              type: string
              format: date-time
              nullable: true
            applications:
              type: array
              description: 요청자(급구는 사장)에게만 반환
              items:
                $ref: '#/components/schemas/Application'
            myApplication:
              type: object
              allOf:
                - $ref: '#/components/schemas/Application'
              nullable: true
              description: 지원자·제안 받은 사람에게만 반환

    Application:
      type: object
      properties:
        id:
          type: integer
          format: int64
        applicantId:
          type: integer
          format: int64
        applicantName:
          type: string
          example: 이진호
        applicantStoreName:
          type: string
          nullable: true
          description: 지원자의 ACTIVE 소속 매장명. 요청 매장 소속을 우선하고, 없으면 같은 사장 매장 중 store_id가 가장 작은 소속을 반환. 현재 소속이 없으면 null. stores와 store_members를 조회하며 별도 저장하지 않음.
          example: 성수점
        helperCount:
          type: integer
          minimum: 0
          description: 같은 사장 매장에서 지원자가 완료한 헬퍼 근무 누적 건수. 종료된 shifts 중 worker_id가 지원자이고, 근무 매장이 현재 ACTIVE 소속이 아닌 행을 집계. 현재 소속 기준 계산값이며 과거 소속의 스냅샷 통계가 아님.
          example: 1
        aiReason:
          type: string
          nullable: true
          maxLength: 200
          description: 근무 가능 시간·시간 겹침 검사·주간 근무량·소속을 근거로 생성하는 한 줄 추천 설명. 추천은 배정을 확정하지 않으며 생성 실패 시 null. UI는 null이면 AI 설명 행을 생략. DB에는 저장하지 않음.
          example: 성수점 소속이고 이번 주 근무가 적어요.
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        offeredShifts:
          type: array
          description: 교대 후보 근무 (공개 교대는 지원자가 내놓은 근무, 지정 교대는 요청자가 고른 상대 근무)
          items:
            $ref: '#/components/schemas/Shift'
        selectedOfferShift:
          type: object
          allOf:
            - $ref: '#/components/schemas/Shift'
          nullable: true
          description: 확정 시 실제로 맞바꾼 근무
        message:
          type: string
          nullable: true
          example: 토요일 저녁 괜찮아요!
        weekHours:
          type: number
          description: 이번 주 근무시간 (서버 계산)
          example: 12
        giveTake:
          $ref: '#/components/schemas/GiveTake'
        rejectComment:
          type: string
          nullable: true
          description: 승인 반려 사유
        createdAt:
          type: string
          format: date-time

    GiveTake:
      type: object
      description: |
        요청자와 이 사람이 주고받은 대타 기록 (저장하지 않고 CONFIRMED 대타 요청으로 계산).
        `gaveToMe > gotFromMe`면 화면에 "갚을 차례" 표시.
      properties:
        gaveToMe:
          type: integer
          description: 이 사람이 나를 도와준 횟수
          example: 3
        gotFromMe:
          type: integer
          description: 내가 이 사람을 도와준 횟수
          example: 1

    ApprovalItem:
      type: object
      description: 승인 대기 한 건 (변경 전후 근무표와 자동 확인 결과 포함)
      properties:
        request:
          $ref: '#/components/schemas/RequestSummary'
        selectedApplication:
          $ref: '#/components/schemas/Application'
        agreedAt:
          type: string
          format: date-time
          description: 상대가 수락·선택한 시각 (request_applications.responded_at)
        changes:
          type: array
          description: 교대면 두 날짜, 대타면 한 날짜
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                example: '2026-09-19'
              before:
                $ref: '#/components/schemas/Shift'
              after:
                $ref: '#/components/schemas/Shift'
        checks:
          type: array
          description: 서버 자동 확인 결과
          items:
            type: object
            properties:
              level:
                type: string
                enum: [OK, WARN]
              message:
                type: string
                example: 정재웅님 이번 주 28시간 → 34시간 (30시간 넘음)

    # -------------------------------------------------------
    # 알림
    # -------------------------------------------------------
    Notification:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [REQUEST_OPENED, OPEN_SHIFT_POSTED, PROPOSAL_RECEIVED, APPLICATION_NEW, APPROVAL_NEEDED, CONFIRMED, REJECTED, EXPIRED, MEMBER_REQUEST]
        message:
          type: string
          example: 이진호님이 교대를 제안했어요
        requestId:
          type: integer
          format: int64
          nullable: true
        storeId:
          type: integer
          format: int64
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # -------------------------------------------------------
    # 에러
    # -------------------------------------------------------
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: HTTP 상태 코드
          example: 409
        errorCode:
          type: string
          description: 화면에서 문구를 고르기 위한 세부 코드
          example: TIME_CONFLICT
        message:
          type: string
          example: 이진호님은 그 시간에 건대점 근무가 있어요.

  responses:
    BadRequest:
      description: 잘못된 요청 (필수 값 누락, 형식 오류 등)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 인증 실패 (토큰 없음·만료)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 권한 없음 (다른 매장이거나 역할이 맞지 않음)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 요청한 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TimeConflict:
      description: 근무자의 다른 근무(다른 매장 포함)와 시간이 겹침
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidState:
      description: 현재 상태에서는 할 수 없는 동작 (예 이미 확정된 요청 취소)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: 페이지 번호 (1부터 시작)
      schema:
        type: integer
        default: 1
        minimum: 1
    SizeParam:
      name: size
      in: query
      required: false
      description: 페이지당 항목 수
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
    StoreIdPath:
      name: storeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ShiftIdPath:
      name: shiftId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ApplicationIdPath:
      name: applicationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    NotificationIdPath:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
